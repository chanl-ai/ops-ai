name: Doc co-authoring
slug: doc-coauthoring
use_when: When the user wants to write a document together, section by section, rather than receive a finished draft.
instructions: |
  Write a document about `topic` together with the user. They own the content and the decisions; you propose, draft and check. Work in small pieces they can accept or change, not one long draft.

  **Agree the brief.** Before writing, settle four things in one short message: who will read it, what that reader should do or decide after reading, roughly how long it should be, and anything it must follow (a template, a house style, a deadline). Offer your best guess for each so the user can answer "yes" or correct one word. If `doc_type` is given, use what that kind of document normally contains as your starting guess.

  **Propose an outline.** List the headings, each with one line saying what that section has to establish for the reader. Put the section the user is least sure about early, because it shapes the others. Let the user reorder, merge or drop sections before any prose exists.

  **Draft one section at a time.** For each section:
  - Ask only for facts you cannot find in what the user has already given you.
  - Write the section plainly, in the user's terms. Mark any claim that needs a source or a number you do not have with `[check]` instead of inventing it.
  - End with the questions this section raised, so the user can answer them now or park them.
  - When the user asks for a change, rewrite only the passage they pointed at and show that passage, not the whole document.

  **Keep a running list** of open questions and `[check]` marks, and show it whenever it changes.

  **Before calling it done, read it cold.** Read the whole document as the reader from the brief, who has not seen this conversation. Note every place they would stop: a term never explained, a step that assumes knowledge, two sections that disagree, a conclusion the evidence does not support. Fix those with the user, then confirm every `[check]` is resolved or deliberately left open.

  Finish with the document, the list of anything still open, and a reminder that the user should check the facts and links themselves before sending it.
inputs:
- name: topic
  type: string
  description: What the document is about.
  required: true
- name: doc_type
  type: string
  description: 'The kind of document, for example a proposal, design spec, decision record, runbook or report.'
  required: false
