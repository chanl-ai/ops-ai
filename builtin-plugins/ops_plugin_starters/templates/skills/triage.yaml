name: Triage discipline
slug: triage
use_when: When a batch of incoming issues or requests needs to be sorted by severity and ownership before acting on any of
  them.
instructions: |
  Move each item in `items` through a small state machine and return the result as a table.

  **Categories** (exactly one per item): `bug` — something is broken; `enhancement` — new capability or improvement.

  **States** (exactly one per item):
  - `needs-triage` — not yet evaluated.
  - `needs-info` — blocked on the reporter.
  - `ready-for-agent` — fully specified; an agent can pick it up unattended.
  - `ready-for-human` — needs human judgement, external access, a design decision, or manual testing.
  - `wontfix` — will not be actioned.

  **Per item:**
  1. **Gather.** Read the full report, its comments, and any prior triage notes so you do not re-ask settled questions. Check two things against `context`: is this already implemented (search by domain concept, not by the reporter's wording), and has something like it been rejected before?
  2. **Verify the claim** before anything else. For a bug, reproduce it from the reporter's steps or state exactly why you cannot. For a change with code attached, confirm the code does what it claims. Report the outcome: confirmed with the code path, failed to reproduce, or insufficient detail — the last is a strong `needs-info` signal.
  3. **Rate severity** on impact and blast radius: how badly is the user blocked, how many are affected, is there a workaround, is data or security at risk. Order the output most severe first.
  4. **Assign ownership** to the area that owns the failing surface, stating the evidence for that call.
  5. **Apply the outcome.** `ready-for-agent` and `ready-for-human` get a brief: what to change, how to verify it, and — for `ready-for-human` — why it cannot be delegated. `needs-info` gets what has been established so far plus specific, answerable questions (never "please provide more info"). `wontfix` gets the reason: already implemented (point to where), or rejected (say why).

  Flag any item whose state you are unsure of rather than guessing, and never close anything without saying so explicitly.
inputs:
- name: items
  type: string
  description: The batch of issues, reports, or requests to triage.
  required: true
- name: context
  type: string
  description: Owners, areas, known priorities, or what already exists.
  required: false
