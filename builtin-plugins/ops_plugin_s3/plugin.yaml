# Amazon S3 buckets, and every store that answers the S3 API, as a source of files. Each request is signed with the
# account's access key (sign-in kind aws_sigv4); every listing names every object, so a removed object is found by its
# absence from the next listing.
schema: ops-ai/plugin@2
id: opsai.s3
title: Amazon S3
version: 0.1.0
sdk: "1"

display:
  category: Knowledge
  description: Files in Amazon S3 buckets, or any store that answers the S3 API, kept current from the bucket.
  docs_url: "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"
  logo: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%237AA116'/><path fill='white' d='M9 10c0-1.7 3.1-3 7-3s7 1.3 7 3l-2 13c0 1.1-2.2 2-5 2s-5-.9-5-2z'/></svg>"

connection:
  kinds: [aws_sigv4]
  # A scheduled check has no person behind it, so the bucket is read with the team's key.
  sign_in: [team]
  health_check: { path: "/" }

settings:
  # Path-style address: a key goes only to the origin of this address, so a bucket is a path under it, never a host.
  endpoint_url:
    type: string
    title: S3 address
    default: "https://s3.us-east-1.amazonaws.com"
    asked: connect

egress: ["{endpoint_url}"]
endpoint: "{endpoint_url}"

tools:
  - name: list_files
    title: List files
    description: The objects in the picked buckets and prefixes, one page of one bucket at a time.
    access: read
    knowledge: list_items
    function: ops_plugin_s3.files:list_files
    input:
      source: { type: object }
      since: { type: string, required: false }
      cursor: { type: string, required: false }
  - name: get_file
    title: Read a file
    description: One object's bytes, or unchanged when its version tag still matches.
    access: read
    knowledge: get_item
    function: ops_plugin_s3.files:get_file
    input:
      source: { type: object }
      id: { type: string }
      tag: { type: string, required: false }
  - name: list_scopes
    title: Find buckets and folders
    description: The buckets the key may list; with a bucket or a folder as parent, the folders under it.
    access: read
    knowledge: list_scopes
    function: ops_plugin_s3.files:list_scopes
    input:
      source: { type: object, required: false }
      query: { type: string, required: false }
      parent: { type: string, required: false }
      cursor: { type: string, required: false }

knowledge_sources:
  - name: files
    title: Amazon S3
    list: list_files
    get: get_file
    scopes: list_scopes
    # Its items are files, so Files can watch its folders.
    files: true
    # Every listing names every object: an object missing from one was removed.
    lists_whole: true
    fetch_at_once: 4
    inputs:
      folders: { type: array, picker: folder, description: "Buckets or folders to take in, each as bucket/prefix" }
    schedule: { kind: daily, time: "02:00" }
