# The GitHub plugin: OAuth sign-in (authorization code), issue reads and a comment write. Every tool is data.
schema: ops-ai/plugin@2
id: opsai.github
title: GitHub
version: 0.2.0
sdk: "1"

display:
  logo: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2324292f'/><path fill='white' d='M16 6a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 2.9.8.1-.6.4-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 16 6z'/></svg>"
  category: Developer tools
  description: Issues and comments in your GitHub repositories.
  docs_url: "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/creating-an-oauth-app"

connection:
  kinds: [oauth2_auth_code]
  authorize_url: "{web_url}/login/oauth/authorize"
  token_url: "{web_url}/login/oauth/access_token"
  scopes:
    - { id: repo, label: "Read and comment on issues in your repositories", required: true }
    - { id: "read:user", label: "Know which account signed in", required: true }
  sign_in: [team, person, person_or_team]
  health_check: { path: /user }
  # What a refused sign-in says, by the code GitHub sends back on the redirect or the token exchange.
  sign_in_errors:
    - error: access_denied
      say: Access was not given in GitHub. Connect again to retry.
      who: person
    - error: redirect_uri_mismatch
      say: "{credential} does not list Ops AI's return address. Add it as the OAuth app's callback URL in GitHub."
      who: admin
    - error: application_suspended
      say: "{credential} is suspended in GitHub. Its owner restores it under the OAuth app's settings."
      who: admin
    - error: incorrect_client_credentials
      say: The client secret for {credential} is wrong. Replace it on its Credentials page.
      who: admin
    - error: bad_verification_code
      say: The GitHub sign-in expired before it finished. Connect again.
      who: person

settings:
  web_url: { type: string, default: "https://github.com", title: Sign-in address }
  api_url: { type: string, default: "https://api.github.com", title: API address }
  api_version: { type: string, default: "2022-11-28", title: API version, lockable: true }

headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "{api_version}"

egress: ["{api_url}", "{web_url}"]
endpoint: "{api_url}"

tools:
  - name: list_issues
    title: List issues
    description: Issues and pull requests in a repository, newest first, up to 50
    access: read
    input:
      owner: { type: string, pattern: "^[A-Za-z0-9-]{1,39}$", description: "The account or organisation, such as octo-org" }
      repo: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$", description: "The repository name, such as dispatch-api" }
      state: { type: string, enum: [open, closed, all], required: false, default: open, description: "Which issues" }
    request:
      method: GET
      path: "/repos/{owner}/{repo}/issues"
      query: { state: "{{state}}", per_page: "50" }
    transform: >-
      {%- set rows = [] -%}
      {%- for i in data -%}
      {%- set _ = rows.append({"number": i.number, "title": i.title, "state": i.state, "author": i.user.login,
          "labels": i.labels | map(attribute="name") | list, "updated_at": i.updated_at, "url": i.html_url}) -%}
      {%- endfor -%}
      {{ {"issues": rows} | tojson }}
  - name: get_issue
    title: Get an issue
    description: One issue by its number, with its body
    access: read
    input:
      owner: { type: string, pattern: "^[A-Za-z0-9-]{1,39}$", description: "The account or organisation" }
      repo: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$", description: "The repository name" }
      number: { type: integer, description: "The issue number" }
    request: { method: GET, path: "/repos/{owner}/{repo}/issues/{number}" }
    transform: >-
      {{ {"number": data.number, "title": data.title, "state": data.state, "author": data.user.login,
          "body": data.body, "labels": data.labels | map(attribute="name") | list, "comments": data.comments,
          "url": data.html_url} | tojson }}
  - name: add_comment
    title: Comment on an issue
    description: Adds a comment to an issue or pull request
    access: write
    input:
      owner: { type: string, pattern: "^[A-Za-z0-9-]{1,39}$", description: "The account or organisation" }
      repo: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$", description: "The repository name" }
      number: { type: integer, description: "The issue number" }
      body: { type: string, description: "The comment, in Markdown" }
    request:
      method: POST
      path: "/repos/{owner}/{repo}/issues/{number}/comments"
      body: '{"body": {{body}}}'
    transform: '{{ {"id": data.id, "url": data.html_url} | tojson }}'

templates:
  - kind: agent
    id: issue-helper
    version: 1
    path: templates/issue-helper.yaml
    requires:
      tools: [list_issues, get_issue, add_comment]
      bind: [{ model_alias: chat }]
