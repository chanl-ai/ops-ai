# The statement budget of each agents-service GET at 5 and 50 rows (ops_service_kit.testing.budget_check, data-access
# standard DA1 and DA6), measured on PostgreSQL by tests/api/test_statement_budget.py. Each row is today's count at 50
# rows. The seed adds rows to agents, skills, guardrails, widgets and cases only; a row for any other list proves its
# count, not that it stays flat as rows grow. Rows listing more than one transaction or connection open one per store
# read and are budgeted as they run until their route is converted. A `not_budgeted` row that grows names its counts.

