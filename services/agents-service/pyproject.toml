[project]
name = "ops-agents-service"
version = "0.1.0"
description = "Agents service: definitions, versions, chat, threads and runs on LangGraph graphs, leases, timers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ops-contracts",
    "ops-service-kit",
    "ops-agent-kernel",
    "ops-checkpointer",
    "ops-metering",
    "ops-policy",
    "ops-store",
    "ops-identity",
    "ops-access",
    "ops-ingest",
    "ops-documents-client",
    "ops-files-client",
    "ops-email",
    "ops-storage",
    "ops-engine",
    "ops-extract",
    "langgraph>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agents"]

[tool.uv.sources]
ops-ingest = { workspace = true }
ops-documents-client = { workspace = true }
ops-files-client = { workspace = true }
ops-email = { workspace = true }
ops-storage = { workspace = true }
ops-store = { workspace = true }
ops-engine = { workspace = true }
ops-extract = { workspace = true }
ops-contracts = { workspace = true }
ops-service-kit = { workspace = true }
ops-agent-kernel = { workspace = true }
ops-checkpointer = { workspace = true }
ops-metering = { workspace = true }
ops-policy = { workspace = true }
ops-identity = { workspace = true }
ops-access = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
