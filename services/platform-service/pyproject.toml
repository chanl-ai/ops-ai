[project]
name = "ops-platform-service"
version = "0.1.0"
description = "platform-service: tenants, teams, members, sessions, API keys and audit; the only issuer of identity tokens"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-service-kit", "ops-policy", "ops-identity", "ops-access", "ops-store", "ops-signin", "ops-email", "fastapi>=0.115", "httpx>=0.27", "sqlalchemy>=2.0", "asyncpg>=0.30", "uvicorn>=0.30", "alembic>=1.13", "cryptography>=43"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_platform"]

[tool.uv.sources]
ops-service-kit = { workspace = true }
ops-policy = { workspace = true }
ops-store = { workspace = true }
ops-identity = { workspace = true }
ops-access = { workspace = true }
ops-signin = { workspace = true }
ops-email = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
