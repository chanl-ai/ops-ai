[project]
name = "ops-models-service"
version = "0.1.0"
description = "models-service: model egress behind bank aliases, per-identity keys with budgets, metadata-only call log"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-service-kit", "ops-metering", "ops-identity", "ops-access", "ops-policy", "ops-store", "fastapi>=0.115", "httpx>=0.27", "sqlalchemy>=2.0", "asyncpg>=0.30", "uvicorn>=0.30", "alembic>=1.13"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_models"]

[tool.uv.sources]
ops-service-kit = { workspace = true }
ops-metering = { workspace = true }
ops-identity = { workspace = true }
ops-access = { workspace = true }
ops-policy = { workspace = true }
ops-store = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[dependency-groups]
# The clients agents-service runs on, so tests prove models-service speaks their wire format.
dev = ["pydantic-ai-slim[openai]>=2.51,<3", "ops-service-kit[testing]"]
