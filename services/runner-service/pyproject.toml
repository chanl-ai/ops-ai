[project]
name = "ops-runner-service"
version = "0.1.0"
description = "Runner service: code tools' Python functions on WASM, with no network and no secrets (data-gateway spec, section c)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-service-kit", "ops-identity", "wasmtime==50.0.1", "pydantic>=2.7,<3", "fastapi>=0.115", "httpx>=0.27", "anyio>=4", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_runner"]

[tool.uv.sources]
ops-service-kit = { workspace = true }
ops-identity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[dependency-groups]
dev = ["ops-service-kit[testing]"]
