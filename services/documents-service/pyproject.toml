[project]
name = "ops-documents-service"
version = "0.1.0"
description = "Documents service: what is read from a file (layouts, extractions, document types, samples, corrections); never holds bytes"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-contracts", "ops-service-kit", "ops-identity", "ops-access", "ops-pii", "ops-store", "ops-extract", "ops-ingest", "ops-files-client", "regex>=2024.11.6", "pydantic>=2.7,<3", "fastapi>=0.115", "httpx>=0.27", "sqlalchemy>=2.0", "asyncpg>=0.30", "uvicorn>=0.30", "alembic>=1.13"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_documents"]

[tool.uv.sources]
ops-service-kit = { workspace = true }
ops-identity = { workspace = true }
ops-access = { workspace = true }
ops-store = { workspace = true }
ops-extract = { workspace = true }
ops-contracts = { workspace = true }
ops-ingest = { workspace = true }
ops-files-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
# A test still running after two minutes prints every thread's stack, so a hang names its test in the QA log.
faulthandler_timeout = 120

[dependency-groups]
dev = ["ops-service-kit[testing]"]
