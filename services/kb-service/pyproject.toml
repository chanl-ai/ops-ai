[project]
name = "ops-kb-service"
version = "0.1.0"
description = "kb-service: department knowledge bases, file sources, and cited passages"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-service-kit", "ops-identity", "ops-ingest", "ops-store", "ops-files-client", "fastapi>=0.115", "httpx>=0.27", "sqlalchemy>=2.0", "asyncpg>=0.30", "uvicorn>=0.30", "alembic>=1.13"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_kb"]

[tool.uv.sources]
ops-service-kit = { workspace = true }
ops-identity = { workspace = true }
ops-ingest = { workspace = true }
ops-store = { workspace = true }
ops-files-service = { workspace = true }
ops-files-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[dependency-groups]
# files-service runs in-process only in tests/test_files_service_intake.py; kb-service itself never imports it.
dev = ["ops-service-kit[testing]", "ops-files-service"]
