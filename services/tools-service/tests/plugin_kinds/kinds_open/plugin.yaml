
schema: ops-ai/plugin@2
id: test.open
title: Open desk
version: 0.1.0
sdk: "1"
connection:
  kinds: [none]
  sign_in: [team]
  health_check: { path: "/open/me" }
settings:
  base_url: { type: string, title: System address, default: "https://api.multi.test" }

egress: ["{base_url}"]
endpoint: "{base_url}/open"
tools:
  - name: get_record
    title: Read a record
    access: read
    input: { id: { type: string, pattern: "^[a-z0-9-]+$" } }
    request: { method: GET, path: "/records/{id}" }
