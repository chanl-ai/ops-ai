schema: ops-ai/plugin@2
id: test.person-key
title: Person key desk
version: 0.1.0
sdk: "1"
connection:
  kinds: [api_key]
  api_key: { placement: header, name: X-Desk-Key }
  sign_in: [person]
  health_check: { path: "/person-key/me" }
display:
  category: Service desk
  description: A desk where each person signs in with their own API key.
  docs_url: https://docs.multi.test/keys
settings:
  base_url: { type: string, title: System address, default: "https://api.multi.test" }

egress: ["{base_url}"]
endpoint: "{base_url}/person-key"
tools:
  - name: get_record
    title: Read a record
    access: read
    input: { id: { type: string, pattern: "^[a-z0-9-]+$" } }
    request: { method: GET, path: "/records/{id}" }
