# Headers for the whole plugin and for one tool, a form-encoded body, and a transfer with an amount limit.
schema: ops-ai/plugin@2
id: test.fields
title: Fields desk
version: 0.1.0
sdk: "1"
connection:
  kinds: [bearer]
  sign_in: [team]
  health_check: { path: "/fields/me" }
settings:
  base_url: { type: string, title: System address, default: "https://api.multi.test" }
  api_version: { type: string, title: API version, default: "2026-10" }
egress: ["{base_url}"]
endpoint: "{base_url}/fields"
headers: { X-Api-Version: "{api_version}" }
tools:
  - name: search
    title: Search records
    access: read
    input: { q: { type: string, required: false } }
    headers: { ConsistencyLevel: eventual }
    request: { method: GET, path: /search }
  - name: find
    title: Find records by status
    access: read
    input: { status: { type: string, enum: [open, closed] } }
    request: { method: GET, path: /search, query: { status: "{{status}}" } }
  - name: post_message
    title: Post a message
    access: write
    requires_approval: false
    input:
      channel: { type: string }
      text: { type: string }
      thread: { type: string, required: false }
    request:
      method: POST
      path: /chat.postMessage
      form: { channel: "{{channel}}", text: "{{text}}", thread_ts: "{{thread}}" }
  - name: transfer
    title: Move money
    access: write
    requires_approval: false
    input: { amount: { type: number }, to: { type: string } }
    amount_max: 5000
    request: { method: POST, path: /transfers }
  - name: echo
    title: Echo what was sent
    access: read
    function: fields_desk.tools:echo
templates:
  - kind: agent
    id: desk-helper
    version: 1
    path: templates/desk-helper.yaml
    requires: { tools: [post_message] }
