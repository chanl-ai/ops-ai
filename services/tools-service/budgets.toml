# The statement budget of each tools-service GET at 5 and 50 rows (ops_service_kit.testing.budget_check, data-access
# standard DA1 and DA6), measured on PostgreSQL by tests/test_statement_budget.py. Each row is today's count at 50
# rows. A route is one transaction on one connection unless its row lists more; the routes listing more open one short
# transaction per store read and are budgeted as they run until their route is converted.

["GET /health"]
queries = 0

["GET /health/background"]
queries = 0

["GET /v1/app-credentials"]
queries = 16

["GET /v1/app-credentials/{credential_id}"]
queries = 18

# A list whose card rows are fresh reads the page's cards only; the first list after a write locks the team's
# defaults row and rebuilds its card rows (store/app_cards.py) as it answers. One GROUP BY per facet (appState,
# category, kind) and one count of the tabs.
["GET /v1/apps"]
queries = 15
first_queries = 21

["GET /v1/apps/{app_id}"]
queries = 45

["GET /v1/apps/{app_id}/accounts"]
queries = 5

["GET /v1/apps/{app_id}/accounts/{account_id}"]
queries = 11

["GET /v1/apps/{app_id}/resources"]
queries = 0

["GET /v1/apps/{app_id}/update"]
queries = 1

["GET /v1/apps/{app_id}/used-by"]
queries = 1

["GET /v1/connection-kinds"]
queries = 0

["GET /v1/egress"]
queries = 3

["GET /v1/egress/hosts"]
queries = 3

["GET /v1/executions"]
queries = 8

["GET /v1/executions/{call_id}"]
