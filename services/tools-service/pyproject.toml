[project]
name = "ops-tools-service"
version = "0.1.0"
description = "Tools service: every write tool call is decided by OPA against an approval token bound to its input"
requires-python = ">=3.12,<3.13"
# ops-agents-service is a temporary dependency: the gateway still loads the seed catalogue and local executors from
# ops_agents.activities. Removing it is a follow-up in docs/architecture/service-map.md.
dependencies = ["ops-agents-service", "ops-agent-kernel", "ops-service-kit", "ops-policy", "ops-store", "ops-identity", "ops-email", "fastapi>=0.115", "httpx>=0.27", "sqlalchemy>=2.0", "asyncpg>=0.30", "uvicorn>=0.30", "pyyaml>=6", "cryptography>=43", "jinja2>=3.1", "mcp>=2.2.0,<2.4"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_tools"]

[tool.uv.sources]
ops-agents-service = { workspace = true }
ops-agent-kernel = { workspace = true }
ops-service-kit = { workspace = true }
ops-policy = { workspace = true }
ops-store = { workspace = true }
ops-identity = { workspace = true }
ops-email = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
