[project]
name = "knowledge-ingest"
version = "0.1.0"
description = "Parsing, splitting, metadata, dedupe and source rules for knowledge ingestion"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
# Needs the Tesseract binary on PATH as well. Kept optional so a deployment without OCR fails a
# scanned page loudly instead of indexing it as empty.
ocr = ["pytesseract>=0.3.13"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyright>=1.1.390",
    "reportlab>=4.2",
    "types-openpyxl>=3.1.5",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_ingest"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
