[alembic]
script_location = %(here)s/migrations
# New revisions are named by their id, as the existing files are (make migration gives the id a UTC timestamp).
file_template = %%(rev)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
