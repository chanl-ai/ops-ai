[project]
name = "ops-files-service"
version = "0.1.0"
description = "Files service: uploads, downloads, dedupe, retention, holds and quarantine (spec files.md)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-storage", "pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_files"]

[tool.uv.sources]
ops-storage = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
