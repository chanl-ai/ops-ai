[project]
name = "ops-files-service"
version = "0.1.0"
description = "Files service: uploads, downloads, dedupe, retention, holds and quarantine (spec files.md)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-storage", "ops-service-kit", "ops-identity", "ops-access", "ops-store", "puremagic>=2.2", "pydantic>=2.7,<3", "fastapi>=0.115", "httpx>=0.27", "sqlalchemy>=2.0", "asyncpg>=0.30", "uvicorn>=0.30", "alembic>=1.13", "azure-identity>=1.17", "cryptography>=42"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_files"]

[tool.uv.sources]
ops-storage = { workspace = true }
ops-service-kit = { workspace = true }
ops-identity = { workspace = true }
ops-access = { workspace = true }
ops-store = { workspace = true }
ops-files-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[dependency-groups]
dev = ["ops-service-kit[testing]", "ops-files-client"]
