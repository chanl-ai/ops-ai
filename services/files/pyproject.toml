[project]
name = "ops-files"
version = "0.1.0"
description = "File storage for Ops AI: uploads, downloads, dedupe, retention, holds and quarantine behind one service"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "boto3>=1.35",
    "azure-storage-blob>=12.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyright>=1.1.390",
    "moto[s3,server]>=5.0.20",
    "boto3-stubs[s3]>=1.35",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_files"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
