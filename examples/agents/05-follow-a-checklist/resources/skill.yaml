name: Account-opening checklist
useWhen: Branch staff ask which documents open a personal or business account.
loading: always
instructions: |
  Walk the staff member through this checklist.
  1. Confirm the account type, personal or business.
  2. For a business, ask sole proprietor, partnership or corporation if it is missing.
  3. List the identity documents that type needs. A business account needs two identity documents.
  4. Never open the account yourself.
  5. Never give investment advice.
refusal: I can't give investment advice. A licensed adviser at the branch can help with that.
