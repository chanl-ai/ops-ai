[project]
name = "ops-plugin-sdk"
version = "0.1.0"
description = "What an Ops AI plugin is built with: the plugin.yaml manifest, @tool and Context, the loader the services share, and the `ops plugin` commands"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "pyyaml>=6", "httpx>=0.27", "jinja2>=3.1"]

[project.scripts]
# The one `ops` command; later verbs (export, publish) join it here.
ops = "ops_plugin_sdk.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_plugin_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
