[project]
name = "ops-ingest"
version = "0.1.0"
description = "Parsing, splitting, metadata, dedupe and source rules for knowledge ingestion"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
# Needs the Tesseract binary on PATH as well. Kept optional so a deployment without OCR fails a
# scanned page loudly instead of indexing it as empty.
ocr = ["pytesseract>=0.3.13"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
