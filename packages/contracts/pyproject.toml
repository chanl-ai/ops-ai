[project]
name = "ops-contracts"
version = "0.1.0"
description = "Pydantic models mirroring the console's API types"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_contracts"]
