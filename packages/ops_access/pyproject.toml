[project]
name = "ops-access"
version = "0.1.0"
description = "What a caller may do: the area and action catalogue, the built-in roles, and can(), the one permission check every service calls"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-identity", "ops-service-kit"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_access"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
