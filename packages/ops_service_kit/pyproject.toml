[project]
name = "ops-service-kit"
version = "0.1.0"
description = "Settings, logging, errors, the response envelope and the OpenAPI gate every service shares"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-contracts", "ops-policy", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "fastapi>=0.115", "httpx>=0.27"]

[project.optional-dependencies]
# ops_service_kit.openapi and ops_service_kit.contract are for scripts and tests, not a running service.
testing = ["httpx>=0.27", "jsonschema>=4.23", "openapi-spec-validator>=0.7"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_service_kit"]

[tool.uv.sources]
ops-contracts = { workspace = true }
ops-policy = { workspace = true }
