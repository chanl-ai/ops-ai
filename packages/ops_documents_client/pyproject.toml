[project]
name = "ops-documents-client"
version = "0.1.0"
description = "documents-service's client for services: extract a file and read a document type, as the caller's team"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-identity", "ops-service-kit", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_documents_client"]

[tool.uv.sources]
ops-identity = { workspace = true }
ops-service-kit = { workspace = true }
