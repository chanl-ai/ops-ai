[project]
name = "ops-checkpointer"
version = "0.1.0"
description = "LangGraph checkpointer on SQLAlchemy Core, on PostgreSQL and SQL Server, with tenant and team isolation"
requires-python = ">=3.12,<3.13"
dependencies = ["langgraph-checkpoint>=4.0", "ops-store", "sqlalchemy[asyncio]>=2.0"]

[tool.uv.sources]
ops-store = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_checkpointer"]
