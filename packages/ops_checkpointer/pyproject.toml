[project]
name = "ops-checkpointer"
version = "0.1.0"
description = "LangGraph checkpointer on asyncpg with tenant row-level security"
requires-python = ">=3.12,<3.13"
dependencies = ["langgraph-checkpoint>=4.0", "asyncpg>=0.30"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_checkpointer"]
