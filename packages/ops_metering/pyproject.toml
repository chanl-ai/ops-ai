[project]
name = "ops-metering"
version = "0.1.0"
description = "Model usage accounting: usage rows, price lookup, cost, totals and budget checks; no I/O"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_metering"]
