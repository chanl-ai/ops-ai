[project]
name = "ops-store"
version = "0.1.0"
description = "The store seam: database guarantees, the Repository protocol, ports and their conformance suites"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = ["ops-service-kit"]

[tool.uv.sources]
ops-service-kit = { workspace = true }
