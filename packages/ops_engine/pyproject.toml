[project]
name = "ops-engine"
version = "0.1.0"
description = "Workflow runner: node type registry, v2 definitions, the LangGraph compiler, the step journal, the work queue and the worker loop"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-service-kit", "ops-store", "ops-agent-kernel", "ops-checkpointer", "langgraph>=1.0", "sqlalchemy[asyncio]>=2.0", "pyyaml>=6", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_engine"]

[tool.uv.sources]
ops-service-kit = { workspace = true }
ops-store = { workspace = true }
ops-agent-kernel = { workspace = true }
ops-checkpointer = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
