[project]
name = "ops-signin"
version = "0.1.0"
description = "Sign-in protocols with no service rules: password hashing, OIDC authorization code with PKCE, SAML SP-initiated sign-in, domain proof by DNS TXT record, and a local fake identity provider for tests"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "pyjwt[crypto]>=2.8", "cryptography>=45", "lxml>=5.2.1", "signxml>=5.1", "dnspython>=2.7"]

[project.optional-dependencies]
# The fake identity provider (`python -m ops_signin.fake_idp`) for tests and the dev stack.
fake = ["fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_signin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
