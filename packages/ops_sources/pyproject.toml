[project]
name = "ops-sources"
version = "0.1.0"
description = "Reading a source through its connection's tools: changes since a saved place with every page read, and paced fetches, behind a state port"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-identity", "ops-service-kit", "pydantic>=2.7"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_sources"]

[tool.uv.sources]
ops-identity = { workspace = true }
ops-service-kit = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
