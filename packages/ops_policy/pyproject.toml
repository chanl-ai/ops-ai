[project]
name = "ops-policy"
version = "0.1.0"
description = "Trust primitives: RFC 8785 canonical JSON, input hashes, signed tokens (HS256 and Ed25519) with expiry and audience, step-up tokens; no rules"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography>=43"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
