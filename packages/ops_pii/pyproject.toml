[project]
name = "ops-pii"
version = "0.1.0"
description = "Personal data masked in what people see: SSNs, card and account numbers, emails and phone numbers, in whole text or streamed"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_pii"]
