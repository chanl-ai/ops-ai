[project]
name = "ops-files-client"
version = "0.1.0"
description = "Typed client other services use to store, read and reference files through files-service with a service token"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ops-identity", "ops-service-kit", "httpx>=0.27", "pydantic>=2.7"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_files_client"]

[tool.uv.sources]
ops-identity = { workspace = true }
ops-service-kit = { workspace = true }
