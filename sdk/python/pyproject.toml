[project]
name = "ops-ai"
version = "0.1.0"
description = "The Ops AI SDK: agents, workflows, runs, human tasks, cases, tools, knowledge and files from Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Outside developers install this on its own, so it depends on nothing in this repository.
dependencies = ["httpx>=0.27,<1", "typing-extensions>=4.12"]

[project.optional-dependencies]
# `opsai plugin validate|test` for operators who build or install plugins; a developer calling the API needs none of it.
plugin = ["ops-plugin-sdk"]

[project.scripts]
# The one command; `opsai plugin` needs the plugin extra. `ops` stays for one release and prints a note: it is a common
# name, so make install-cli leaves its shim out when another `ops` is on PATH.
opsai = "ops_ai.cli:main"
ops = "ops_ai.cli:main_ops"

[project.urls]
Documentation = "https://opsai.chanl.ai/docs/sdk/python"
Source = "https://github.com/chanl-ai/ops-ai"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_ai"]
