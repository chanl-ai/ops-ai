[project]
name = "ops-ai"
version = "0.1.0"
description = "The Ops AI SDK: agents, workflows, runs, human tasks, cases, tools, knowledge and files from Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Outside developers install this on its own, so it depends on nothing in this repository.
dependencies = ["httpx>=0.27,<1", "typing-extensions>=4.12"]

[project.urls]
Documentation = "https://opsai.chanl.ai/docs/sdk/python"
Source = "https://github.com/chanl-ai/ops-ai"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_ai"]
