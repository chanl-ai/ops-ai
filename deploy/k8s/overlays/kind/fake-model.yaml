# The fake OpenAI-compatible model for the proof: committed rules, never a provider. models-service reaches it as
# http://fake-model:8746/v1 once connect_model.py binds the alias.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-model
  labels: {app.kubernetes.io/name: fake-model, app.kubernetes.io/part-of: ops-ai}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: fake-model}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fake-model, app.kubernetes.io/part-of: ops-ai}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      volumes: [{name: tmp, emptyDir: {}}]
      containers:
        - name: fake-model
          image: ops-ai/models
          imagePullPolicy: IfNotPresent
          command: [python, -m, fake_openai, /app/services/models-service/seed/demo-fake-openai]
          env:
            - {name: FAKE_OPENAI_HOST, value: 0.0.0.0}
            - {name: FAKE_OPENAI_PORT, value: "8746"}
            - {name: PYTHONPATH, value: /app/services/models-service/scripts}
          ports: [{containerPort: 8746}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          readinessProbe: {httpGet: {path: /health, port: 8746}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-model
spec:
  selector: {app.kubernetes.io/name: fake-model}
  ports: [{port: 8746, targetPort: 8746}]
