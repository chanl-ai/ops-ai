---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/part-of: ops-ai
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
        app.kubernetes.io/part-of: ops-ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: console
        image: ops-ai/console
        imagePullPolicy: IfNotPresent
        env: []
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        envFrom:
        - configMapRef:
            name: ops-console
        ports:
        - containerPort: 3016
          name: http
        startupProbe:
          httpGet:
            path: /login
            port: 3016
          periodSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /login
            port: 3016
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /login
            port: 3016
          periodSeconds: 20
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/part-of: ops-ai
spec:
  selector:
    app.kubernetes.io/name: console
  ports:
  - name: http
    port: 3016
    targetPort: 3016
