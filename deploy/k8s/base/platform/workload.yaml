---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/part-of: ops-ai
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
        app.kubernetes.io/part-of: ops-ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: platform
        image: ops-ai/platform
        imagePullPolicy: IfNotPresent
        env:
        - name: OPS_SERVICE_SIGNING_KID
          value: svc-platform-1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        envFrom:
        - configMapRef:
            name: ops-settings
        - configMapRef:
            name: ops-origin
        - secretRef:
            name: ops-platform
        ports:
        - containerPort: 8710
          name: http
        startupProbe:
          httpGet:
            path: /v1/health
            port: 8710
          periodSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8710
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8710
          periodSeconds: 20
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/part-of: ops-ai
spec:
  selector:
    app.kubernetes.io/name: platform
  ports:
  - name: http
    port: 8710
    targetPort: 8710
  - name: internal
    port: 8711
    targetPort: 8711
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-internal
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/part-of: ops-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8710
  - from:
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - agents
          - tools
          - models
          - kb
          - files
          - documents
    ports:
    - protocol: TCP
      port: 8711
