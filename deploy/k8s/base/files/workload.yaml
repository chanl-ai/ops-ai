---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files-data
  labels:
    app.kubernetes.io/name: files
    app.kubernetes.io/part-of: ops-ai
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: files
  labels:
    app.kubernetes.io/name: files
    app.kubernetes.io/part-of: ops-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: files
  template:
    metadata:
      labels:
        app.kubernetes.io/name: files
        app.kubernetes.io/part-of: ops-ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: files
        image: ops-ai/files
        imagePullPolicy: IfNotPresent
        env:
        - name: OPS_SERVICE_SIGNING_KID
          value: svc-files-1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        envFrom:
        - configMapRef:
            name: ops-settings
        - configMapRef:
            name: ops-origin
        - secretRef:
            name: ops-files
        ports:
        - containerPort: 8750
          name: http
        startupProbe:
          httpGet:
            path: /health
            port: 8750
          periodSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8750
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8750
          periodSeconds: 20
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: files-data
---
apiVersion: v1
kind: Service
metadata:
  name: files
  labels:
    app.kubernetes.io/name: files
    app.kubernetes.io/part-of: ops-ai
spec:
  selector:
    app.kubernetes.io/name: files
  ports:
  - name: http
    port: 8750
    targetPort: 8750
