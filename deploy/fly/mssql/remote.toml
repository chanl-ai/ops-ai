# A shared SQL Server for running the both-database tests from a Mac, where no SQL Server 2022 or later image runs
# (deploy/database/mssql_local.sh's Azure SQL Edge is engine 15, and the golden schema needs compatibility level 160).
# The same image and edition as CI's store-mssql job. No service and no IP: only `fly proxy` over the organisation's
# private network reaches it. The SA password is the MSSQL_SA_PASSWORD secret. Driven by deploy/database/mssql_remote.sh
# (make mssql-remote-up / -proxy / -status / -down), which passes the app name; this file names none.
app = "<app-prefix>-test-mssql"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  # Keep in step with the store-mssql job in .github/workflows/ci.yml: the same 2025-latest digest. By digest alone,
  # since Fly refuses a tag together with a digest.
  image = "mcr.microsoft.com/mssql/server@sha256:21cba63f9e5f93ae72d211e50bceca8f047a6233da18ed5ecb497152f97eca7b"

[env]
  ACCEPT_EULA = "Y"
  MSSQL_PID = "Developer"
  # Leaves about 1 GB of the 4 GB machine to the OS; uncapped, SQL Server takes nearly all of it.
  MSSQL_MEMORY_LIMIT_MB = "3072"

[[mounts]]
  source = "mssql_data"
  destination = "/var/opt/mssql"
  initial_size = "5gb"

[checks.sql]
  type = "tcp"
  port = 1433
  interval = "30s"
  timeout = "5s"
  grace_period = "120s"

[[vm]]
  size = "shared-cpu-2x"
  memory = 4096
