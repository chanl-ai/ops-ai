# Generated by deploy/fly/staging/apps.py; edit there. Image: deploy/fly/Dockerfile target opa.
# Replace <app-prefix> with STG_APP_PREFIX (deploy/fly/staging.env.example), then from the repo root:
#   sed "s/<app-prefix>/$STG_APP_PREFIX/g" deploy/fly/staging/opa.toml > deploy/fly/staging/opa.rendered.toml
#   fly deploy . -c deploy/fly/staging/opa.rendered.toml --local-only; rm deploy/fly/staging/opa.rendered.toml
app = "<app-prefix>-opa"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "../Dockerfile"
  ignorefile = "../Dockerfile.dockerignore"
  build-target = "opa"

[deploy]
  strategy = "immediate"

[processes]
  app = "run --server --addr [::]:8181 --log-level error /policy"

[env]

[checks.health]
  type = "http"
  port = 8181
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 256
