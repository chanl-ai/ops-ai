# Generated by deploy/fly/staging/apps.py; edit there. Image: deploy/fly/Dockerfile target models.
# Deploy from the repo root: fly deploy . -c deploy/fly/staging/fake.toml --local-only
app = "<your-app>-fake"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "../Dockerfile"
  ignorefile = "../Dockerfile.dockerignore"
  build-target = "models"

[deploy]
  strategy = "immediate"

[processes]
  app = "python -m fake_openai /app/services/models-service/seed/demo-fake-openai"

[env]
  FAKE_OPENAI_HOST = "*"
  FAKE_OPENAI_PORT = "8746"
  PYTHONPATH = "/app/services/models-service/scripts"

[checks.health]
  type = "http"
  port = 8746
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 256
