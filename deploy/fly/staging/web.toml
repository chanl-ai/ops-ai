# Generated by deploy/fly/staging/apps.py; edit there. Image: deploy/fly/Dockerfile target proxy.
# Deploy from the repo root: fly deploy . -c deploy/fly/staging/web.toml --local-only
app = "<your-app>-web"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "../Dockerfile"
  ignorefile = "../Dockerfile.dockerignore"
  build-target = "proxy"

[deploy]
  strategy = "immediate"

[env]
  OPS_UPSTREAM_PLATFORM = "<your-app>-platform.internal:8710"
  OPS_UPSTREAM_AGENTS = "<your-app>-agents.internal:8700"
  OPS_UPSTREAM_TOOLS = "<your-app>-tools.internal:8720"
  OPS_UPSTREAM_KB = "<your-app>-kb.internal:8740"
  OPS_UPSTREAM_FILES = "<your-app>-files.internal:8750"
  OPS_UPSTREAM_DOCUMENTS = "<your-app>-documents.internal:8760"
  OPS_UPSTREAM_MODELS = "<your-app>-models.internal:8730"
  OPS_UPSTREAM_CONSOLE = "<your-app>-console.internal:3016"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[checks.health]
  type = "http"
  port = 8080
  path = "/api/platform/v1/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 256
