# Generated by deploy/fly/staging/apps.py; edit there. Image: deploy/fly/Dockerfile target proxy.
# Replace <app-prefix> with STG_APP_PREFIX (deploy/fly/staging.env.example), then from the repo root:
#   sed "s/<app-prefix>/$STG_APP_PREFIX/g" deploy/fly/staging/web.toml > deploy/fly/staging/web.rendered.toml
#   fly deploy . -c deploy/fly/staging/web.rendered.toml --local-only; rm deploy/fly/staging/web.rendered.toml
app = "<app-prefix>-web"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "../Dockerfile"
  ignorefile = "../Dockerfile.dockerignore"
  build-target = "proxy"

[deploy]
  strategy = "immediate"

[env]
  OPS_UPSTREAM_PLATFORM = "<app-prefix>-platform.internal:8710"
  OPS_UPSTREAM_AGENTS = "<app-prefix>-agents.internal:8700"
  OPS_UPSTREAM_TOOLS = "<app-prefix>-tools.internal:8720"
  OPS_UPSTREAM_KB = "<app-prefix>-kb.internal:8740"
  OPS_UPSTREAM_FILES = "<app-prefix>-files.internal:8750"
  OPS_UPSTREAM_DOCUMENTS = "<app-prefix>-documents.internal:8760"
  OPS_UPSTREAM_MODELS = "<app-prefix>-models.internal:8730"
  OPS_UPSTREAM_CONSOLE = "<app-prefix>-console.internal:3016"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[checks.health]
  type = "http"
  port = 8080
  path = "/api/platform/v1/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 256
