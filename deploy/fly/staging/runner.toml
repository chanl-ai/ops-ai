# Generated by deploy/fly/staging/apps.py; edit there. Image: deploy/fly/Dockerfile target runner.
# Replace <app-prefix> with STG_APP_PREFIX (deploy/fly/staging.env.example), then from the repo root:
#   sed "s/<app-prefix>/$STG_APP_PREFIX/g" deploy/fly/staging/runner.toml > deploy/fly/staging/runner.rendered.toml
#   fly deploy . -c deploy/fly/staging/runner.rendered.toml --local-only; rm deploy/fly/staging/runner.rendered.toml
app = "<app-prefix>-runner"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "../Dockerfile"
  ignorefile = "../Dockerfile.dockerignore"
  build-target = "runner"

[deploy]
  strategy = "immediate"

[env]
  OPS_ENVIRONMENT = "production"
  OPS_AUTH_MODE = "platform"
  OPS_BIND_HOST = "*"
  OPS_CORS_ORIGINS = "[\"https://<app-prefix>-web.fly.dev\"]"
  OPS_CONSOLE_URL = "https://<app-prefix>-web.fly.dev"
  OPS_PLATFORM_PUBLIC_URL = "https://<app-prefix>-web.fly.dev/api/platform"
  OPS_FILES_PUBLIC_URL = "https://<app-prefix>-web.fly.dev/api/files"
  OPS_PLATFORM_URL = "http://<app-prefix>-platform.internal:8710"
  OPS_PLATFORM_INTERNAL_URL = "http://<app-prefix>-platform.internal:8711"
  OPS_AGENTS_URL = "http://<app-prefix>-agents.internal:8700"
  OPS_GATEWAY_URL = "http://<app-prefix>-tools.internal:8720"
  OPS_TOOLS_URL = "http://<app-prefix>-tools.internal:8720"
  OPS_MODELS_URL = "http://<app-prefix>-models.internal:8730"
  OPS_KB_URL = "http://<app-prefix>-kb.internal:8740"
  OPS_FILES_URL = "http://<app-prefix>-files.internal:8750"
  OPS_DOCUMENTS_URL = "http://<app-prefix>-documents.internal:8760"
  OPS_RUNNER_URL = "http://<app-prefix>-runner.internal:8770"
  OPS_OPA_URL = "http://<app-prefix>-opa.internal:8181"
  OPS_FILES_DIR = "/tmp/ops/files"
  OPS_KB_FILES_DIR = "/tmp/ops/kb-files"
  OPS_FILES_SCANNING = "eicar"
  OPS_MAILBOX_SOURCE = "none"
  OPS_MAIL_PROVIDER = "none"
  OPS_BOOTSTRAP_TENANT_ID = "local"

[checks.health]
  type = "http"
  port = 8770
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 512
