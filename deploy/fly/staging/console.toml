# Generated by deploy/fly/staging/apps.py; edit there. Image: deploy/fly/Dockerfile target console.
# Deploy from the repo root: fly deploy . -c deploy/fly/staging/console.toml --local-only
app = "<your-app>-console"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "../Dockerfile"
  ignorefile = "../Dockerfile.dockerignore"
  build-target = "console"

[deploy]
  strategy = "immediate"

[env]
  HOSTNAME = "::"
  NEXT_PUBLIC_OPS_PLATFORM_API_URL = "https://<your-app>-web.fly.dev/api/platform"
  NEXT_PUBLIC_OPS_CHAT_API_URL = "https://<your-app>-web.fly.dev/api/agents"
  NEXT_PUBLIC_OPS_CASES_API_URL = "https://<your-app>-web.fly.dev/api/agents"
  NEXT_PUBLIC_OPS_REGISTRY_API_URL = "https://<your-app>-web.fly.dev/api/agents"
  NEXT_PUBLIC_OPS_TOOLS_API_URL = "https://<your-app>-web.fly.dev/api/tools"
  NEXT_PUBLIC_OPS_KNOWLEDGE_API_URL = "https://<your-app>-web.fly.dev/api/kb"
  NEXT_PUBLIC_OPS_FILES_API_URL = "https://<your-app>-web.fly.dev/api/files"
  NEXT_PUBLIC_OPS_DOCUMENTS_API_URL = "https://<your-app>-web.fly.dev/api/documents"

[checks.health]
  type = "http"
  port = 3016
  path = "/login"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 512
