# Generated by deploy/fly/staging/apps.py; edit there. Image: deploy/fly/Dockerfile target console.
# Replace <app-prefix> with STG_APP_PREFIX (deploy/fly/staging.env.example), then from the repo root:
#   sed "s/<app-prefix>/$STG_APP_PREFIX/g" deploy/fly/staging/console.toml > deploy/fly/staging/console.rendered.toml
#   fly deploy . -c deploy/fly/staging/console.rendered.toml --local-only; rm deploy/fly/staging/console.rendered.toml
app = "<app-prefix>-console"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "../Dockerfile"
  ignorefile = "../Dockerfile.dockerignore"
  build-target = "console"

[deploy]
  strategy = "immediate"

[env]
  HOSTNAME = "::"
  NEXT_PUBLIC_OPS_PLATFORM_API_URL = "https://<app-prefix>-web.fly.dev/api/platform"
  NEXT_PUBLIC_OPS_CHAT_API_URL = "https://<app-prefix>-web.fly.dev/api/agents"
  NEXT_PUBLIC_OPS_CASES_API_URL = "https://<app-prefix>-web.fly.dev/api/agents"
  NEXT_PUBLIC_OPS_REGISTRY_API_URL = "https://<app-prefix>-web.fly.dev/api/agents"
  NEXT_PUBLIC_OPS_TOOLS_API_URL = "https://<app-prefix>-web.fly.dev/api/tools"
  NEXT_PUBLIC_OPS_KNOWLEDGE_API_URL = "https://<app-prefix>-web.fly.dev/api/kb"
  NEXT_PUBLIC_OPS_FILES_API_URL = "https://<app-prefix>-web.fly.dev/api/files"
  NEXT_PUBLIC_OPS_DOCUMENTS_API_URL = "https://<app-prefix>-web.fly.dev/api/documents"
  NEXT_PUBLIC_OPS_MODELS_API_URL = "https://<app-prefix>-web.fly.dev/api/models"

[checks.health]
  type = "http"
  port = 3016
  path = "/login"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 512
