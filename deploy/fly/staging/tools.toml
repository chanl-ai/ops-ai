# Generated by deploy/fly/staging/apps.py; edit there. Image: deploy/fly/Dockerfile target tools.
# Deploy from the repo root: fly deploy . -c deploy/fly/staging/tools.toml --local-only
app = "<your-app>-tools"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "../Dockerfile"
  ignorefile = "../Dockerfile.dockerignore"
  build-target = "tools"

[deploy]
  strategy = "immediate"

[env]
  OPS_ENVIRONMENT = "production"
  OPS_AUTH_MODE = "platform"
  OPS_BIND_HOST = "*"
  OPS_CORS_ORIGINS = "[\"https://<your-app>-web.fly.dev\"]"
  OPS_CONSOLE_URL = "https://<your-app>-web.fly.dev"
  OPS_PLATFORM_PUBLIC_URL = "https://<your-app>-web.fly.dev/api/platform"
  OPS_FILES_PUBLIC_URL = "https://<your-app>-web.fly.dev/api/files"
  OPS_PLATFORM_URL = "http://<your-app>-platform.internal:8710"
  OPS_PLATFORM_INTERNAL_URL = "http://<your-app>-platform.internal:8711"
  OPS_AGENTS_URL = "http://<your-app>-agents.internal:8700"
  OPS_GATEWAY_URL = "http://<your-app>-tools.internal:8720"
  OPS_TOOLS_URL = "http://<your-app>-tools.internal:8720"
  OPS_MODELS_URL = "http://<your-app>-models.internal:8730"
  OPS_KB_URL = "http://<your-app>-kb.internal:8740"
  OPS_FILES_URL = "http://<your-app>-files.internal:8750"
  OPS_DOCUMENTS_URL = "http://<your-app>-documents.internal:8760"
  OPS_OPA_URL = "http://<your-app>-opa.internal:8181"
  OPS_FILES_DIR = "/tmp/ops/files"
  OPS_KB_FILES_DIR = "/tmp/ops/kb-files"
  OPS_FILES_SCANNING = "eicar"
  OPS_MAILBOX_SOURCE = "none"
  OPS_MAIL_PROVIDER = "none"
  OPS_BOOTSTRAP_TENANT_ID = "local"

[checks.health]
  type = "http"
  port = 8720
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 256
