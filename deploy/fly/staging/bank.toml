# Generated by deploy/fly/staging/apps.py; edit there. Image: deploy/fly/Dockerfile target tools.
# Replace <app-prefix> with STG_APP_PREFIX (deploy/fly/staging.env.example), then from the repo root:
#   sed "s/<app-prefix>/$STG_APP_PREFIX/g" deploy/fly/staging/bank.toml > deploy/fly/staging/bank.rendered.toml
#   fly deploy . -c deploy/fly/staging/bank.rendered.toml --local-only; rm deploy/fly/staging/bank.rendered.toml
app = "<app-prefix>-bank"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "../Dockerfile"
  ignorefile = "../Dockerfile.dockerignore"
  build-target = "tools"

[deploy]
  strategy = "immediate"

[processes]
  app = "python -m uvicorn --app-dir /app/services/tools-service/scripts fake_bank.app:app --host 0.0.0.0 --port 8080"

[env]
  FAKE_BANK_PUBLIC_URL = "https://<app-prefix>-bank.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[checks.health]
  type = "http"
  port = 8080
  path = "/openapi.json"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 256
