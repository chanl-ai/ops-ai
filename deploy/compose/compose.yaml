# Local dev stack: PostgreSQL for the agents and tools services, OPA for the tools service, and test mail servers. Port 5477 so it sits
# beside other local Postgres instances. The project name stays ops-runtime so the existing data volume is reused.
name: ops-runtime
services:
  postgres:
    # PostgreSQL 17 with pgvector, which knowledge search by meaning needs. A stack started on the older alpine image
    # moves with `make db-move-image` (dump, a fresh volume on this image, restore): its data folder is not reused,
    # since the two images sort text differently and text indexes would be wrong.
    image: ${OPS_BASE_IMAGE_PREFIX:-}pgvector/pgvector:pg17
    # One Postgres serves the shared stack, every isolated use-case stack, the QA run and the test suites, each pool up to
    # 15 connections per service; the default of 100 ran out with four isolated stacks up ("too many clients already").
    # Takes effect when the container is recreated.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops_runtime
    ports:
      - "${OPS_PG_PORT:-5477}:5432"
    volumes:
      - ops-runtime-pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops_runtime"]
      interval: 2s
      timeout: 3s
      retries: 30
  # The tool gateway's policy engine: the official OPA image serving services/tools-service/policy. Port 8181 is OPA's
  # default; only the gateway calls it.
  opa:
    image: ${OPS_BASE_IMAGE_PREFIX:-}openpolicyagent/opa:1.21.1
    command: ["run", "--server", "--watch", "--addr", "0.0.0.0:8181", "--log-level", "error", "/policy"]
    ports:
      - "${OPS_OPA_PORT:-8181}:8181"
    volumes:
      - ../../services/tools-service/policy:/policy:ro
  # Test mail servers, for dev and the tests only; no release needs them. GreenMail is a real SMTP and IMAP
  # server: mail sent to any address on its SMTP port lands in that address's mailbox, read over IMAP with any password
  # (auth disabled). Mailpit catches what the platform sends over SMTP and shows it on its HTTP API and web page.
  greenmail:
    image: ${OPS_BASE_IMAGE_PREFIX:-}greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled"
    ports:
      - "${OPS_GREENMAIL_SMTP_PORT:-3025}:3025"
      - "${OPS_GREENMAIL_IMAP_PORT:-3143}:3143"
  mailpit:
    image: ${OPS_BASE_IMAGE_PREFIX:-}axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${OPS_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${OPS_MAILPIT_HTTP_PORT:-8025}:8025"
volumes:
  # The pgvector image's data; ops-runtime-pg, the alpine image's, is left as it was (db-move-image copies it here).
  ops-runtime-pgvector:
