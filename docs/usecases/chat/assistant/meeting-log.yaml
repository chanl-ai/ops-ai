# The meeting log flow on a real Salesforce org, as James with the real model: the assistant finds the one open
# opportunity that fits and goes straight to one review form (it asks only when several fit); Save writes the opportunity
# and the meeting's Task in one save_records call; the saved card shows old -> new. Needs the demo records
# (make demo-org-seed AS=james), and save_records added to James's team. make demo-org-remove AS=james then
# make demo-org-seed AS=james puts the opportunity back before a second run.
as: [james]
real: [james]
turns:
  - say: "Log my meeting with the Okafor Family Trust: Grace wants to add $25,000 and we agreed to move to the proposal stage"
    expect:
      tool: salesforce_query
      widget: form
      says: ["Education savings"]
      noInternalIds: true
      maxSteps: 4
  - say: "Save these to Salesforce (Stage: Proposal/Price Quote, Amount: 75000, Note: Grace Okafor wants to add $25,000 to the education savings plan. Agreed to move to proposal.)"
    expect:
      tool: salesforce_save_records
      notTools: [load_skill, salesforce_query, salesforce_search]
      widget: entity
      noQuestion: true
      noInternalIds: true
      noErrorCode: true
      maxSteps: 2
