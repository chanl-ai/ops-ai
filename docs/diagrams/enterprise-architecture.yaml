# The enterprise picture: the platform with what an enterprise runs around it. Free layout: coordinates are the
# drawing's own units. Drawn by the docs site (apps/docs) and exported to enterprise-architecture.svg with
# `pnpm --filter docs diagrams`.
title: >-
  Ops AI architecture: identity, observability and secrets across the top; people, the platform, both gateways and outside systems;
  dependencies; build to deploy
layout: free
width: 1260
height: 990
bands:
  - {'y': 24, color: indigo, number: 1, label: IDENTITY, text: Enterprise IdP (Entra ID · Okta · Keycloak) → platform-service issues tokens → every service verifies them locally}
  - {'y': 60, color: violet, number: 2, label: OBSERVABILITY, text: Structured events and run journals → OpenTelemetry collector → APM and trace store}
  - {'y': 96, color: teal, number: 3, label: SECRETS, text: Vault · Key Vault · Secrets Manager → OPS_* environment → one settings class per process}
groups:
  - {x: 40, 'y': 150, w: 160, h: 516, color: slate, label: PEOPLE AND SYSTEMS}
  - {x: 220, 'y': 150, w: 700, h: 516, color: slate, label: OPS AI PLATFORM, outline: true}
