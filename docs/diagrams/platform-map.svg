<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 606" width="980" height="606" role="img" aria-label="Ops AI: agents, workflows, the shared services and the service host" class="ops-box-diagram"><title>Ops AI: agents, workflows, the shared services and the service host</title><style>svg{--d-fg:#1d1f22;--d-muted:#5d636b;--d-card:#ffffff;--d-soft:#f1f2f3;--d-accent:#2f5bd3;--d-new:#0f7a55;--d-new-soft:#e3f4ec;--d-pack:#5b3fd1;--d-pack-soft:#efeafc;--d-host:#1a5fb4;--d-host-soft:#e4edf9;--d-green:#12804a;--d-green-soft:#e2f3ea;--d-indigo:#4a55d4;--d-indigo-soft:#eceefd;--d-violet:#7a44c8;--d-violet-soft:#f2ebfc;--d-teal:#0b7a83;--d-teal-soft:#e0f2f3;--d-blue:#1d6fd1;--d-blue-soft:#e4effc;--d-amber:#a5650b;--d-amber-soft:#fcf0dc;--d-rose:#b8324f;--d-rose-soft:#fbe8ed;--d-slate:#4c5868;--d-slate-soft:#edf0f4}@media (prefers-color-scheme: dark){svg{--d-fg:#e6e8eb;--d-muted:#a0a6ae;--d-card:#1c1f23;--d-soft:#22262b;--d-accent:#8fb0ff;--d-new:#5fd3a5;--d-new-soft:#17332a;--d-pack:#b7a6ff;--d-pack-soft:#2a2347;--d-host:#8ab6f2;--d-host-soft:#1c2a40;--d-green:#4fcf8c;--d-green-soft:#11291d;--d-indigo:#929bff;--d-indigo-soft:#1b1f3d;--d-violet:#c19bff;--d-violet-soft:#251a3a;--d-teal:#5ccfd8;--d-teal-soft:#0f2a2d;--d-blue:#6fb0ff;--d-blue-soft:#11243b;--d-amber:#f0b45a;--d-amber-soft:#2e220f;--d-rose:#ff8fa8;--d-rose-soft:#36161f;--d-slate:#a9b5c5;--d-slate-soft:#1c232d}}
.ops-box-diagram{font-family:var(--ops-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);color:var(--d-fg)}
.ops-box-diagram .grp{fill:var(--d-card);stroke:var(--d-fg);stroke-width:1.2}
.ops-box-diagram .bx{fill:var(--d-card);stroke:var(--d-fg);stroke-width:1.2}
.ops-box-diagram .bx-port{fill:var(--d-soft);stroke:var(--d-fg);stroke-width:1}
.ops-box-diagram .grp-new,.ops-box-diagram .bx-new{fill:var(--d-new-soft);stroke:var(--d-new);stroke-width:1.4;stroke-dasharray:5 3}
.ops-box-diagram .bx-pack{fill:var(--d-pack-soft);stroke:var(--d-pack);stroke-width:1.3}
.ops-box-diagram .grp-host,.ops-box-diagram .bx-host{fill:var(--d-host-soft);stroke:var(--d-host);stroke-width:1.3}
.ops-box-diagram .grp-muted,.ops-box-diagram .bx-muted{fill:var(--d-soft);stroke:var(--d-muted);stroke-width:1;stroke-dasharray:2 3}
.ops-box-diagram .ln{fill:none;stroke:var(--d-fg);stroke-width:1.3}
.ops-box-diagram .arrow{fill:var(--d-fg)}
.ops-box-diagram:not(.ops-free) text{fill:var(--d-fg)}
.ops-box-diagram .t{font-size:13px}
.ops-box-diagram .tb{font-size:13px;font-weight:600}
.ops-box-diagram .ts{font-size:11.5px;fill:var(--d-muted)}
.ops-box-diagram .lbl{font-size:11.5px;fill:var(--d-accent)}
.ops-box-diagram .lnk:hover rect{stroke:var(--d-accent);stroke-width:2}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect class="grp" x="20" y="20" width="440" height="244" rx="10"/><text class="tb" x="36" y="46">Agents (agents-service)</text><text class="ts" x="36" y="64">like Relevance AI: the agent decides its steps</text><rect class="bx bx-port" x="36" y="78" width="77.91583166332666" height="36" rx="6"/><text class="t" x="74.95791583166333" y="100" text-anchor="middle">Chat</text><rect class="bx bx-port" x="123.91583166332666" y="78" width="77.91583166332666" height="36" rx="6"/><text class="t" x="162.87374749498997" y="100" text-anchor="middle">Jobs</text><rect class="bx bx-port" x="211.8316633266533" y="78" width="77.91583166332666" height="36" rx="6"/><text class="t" x="250.78957915831666" y="100" text-anchor="middle">Test</text><rect class="bx bx-port" x="299.74749498997994" y="78" width="144.25250501002006" height="36" rx="6"/><text class="t" x="371.87374749498997" y="100" text-anchor="middle">Agent as a tool</text><rect class="bx bx-new" x="36" y="126" width="408" height="36" rx="6"/><text class="tb" x="240" y="148" text-anchor="middle">Agent run API, run queue, run worker</text><rect class="bx" x="36" y="174" width="408" height="36" rx="6"/><text class="tb" x="240" y="196" text-anchor="middle">Agent kernel core: turn loop, budget, approval, guardrails</text><text class="ts" x="36" y="239">capability packs:</text><rect class="bx bx-pack" x="153.57" y="222" width="46.18175738724727" height="26" rx="6"/><text class="ts" x="176.66087869362363" y="239" text-anchor="middle">tools</text><rect class="bx bx-pack" x="205.75175738724727" y="222" width="69.56921617418351" height="26" rx="6"/><text class="ts" x="240.53636547433902" y="239" text-anchor="middle">knowledge</text><rect class="bx bx-pack" x="281.3209735614308" y="222" width="52.02862208398134" height="26" rx="6"/><text class="ts" x="307.3352846034214" y="239" text-anchor="middle">skills</text><rect class="bx bx-pack" x="339.34959564541214" y="222" width="104.65040435458788" height="26" rx="6"/><text class="ts" x="391.67479782270607" y="239" text-anchor="middle">guardrail kinds</text><rect class="grp" x="520" y="20" width="440" height="244" rx="10"/><text class="tb" x="536" y="46">Workflows (workflows service)</text><text class="ts" x="536" y="64">like n8n and LangGraph: the same steps every time</text><rect class="bx bx-port" x="536" y="78" width="136.14443610902725" height="36" rx="6"/><text class="t" x="604.0722180545137" y="100" text-anchor="middle">Editor and forms</text><rect class="bx bx-port" x="682.1444361090273" y="78" width="136.14443610902725" height="36" rx="6"/><text class="t" x="750.216654163541" y="100" text-anchor="middle">Runs and journal</text><rect class="bx bx-port" x="828.2888722180546" y="78" width="115.7111277819455" height="36" rx="6"/><text class="t" x="886.1444361090274" y="100" text-anchor="middle">Start-run API</text><rect class="bx bx-new" x="536" y="126" width="408" height="36" rx="6"/><text class="tb" x="740" y="148" text-anchor="middle">Node SDK: one contract per node type</text><rect class="bx" x="536" y="174" width="408" height="36" rx="6"/><text class="tb" x="740" y="196" text-anchor="middle">Core engine: journal, queue, workers, leases, flow nodes</text><text class="ts" x="536" y="239">node packs:</text><rect class="bx bx-pack" x="616.31" y="222" width="48" height="26" rx="6"/><text class="ts" x="640.31" y="239" text-anchor="middle">ai</text><rect class="bx bx-pack" x="670.31" y="222" width="49.05" height="26" rx="6"/><text class="ts" x="694.8349999999999" y="239" text-anchor="middle">tools</text><rect class="bx bx-pack" x="725.3599999999999" y="222" width="49.05" height="26" rx="6"/><text class="ts" x="749.8849999999999" y="239" text-anchor="middle">files</text><rect class="bx bx-pack" x="780.4099999999999" y="222" width="55.260000000000005" height="26" rx="6"/><text class="ts" x="808.0399999999998" y="239" text-anchor="middle">agents</text><rect class="bx bx-pack" x="841.6699999999998" y="222" width="67.68" height="26" rx="6"/><text class="ts" x="875.5099999999999" y="239" text-anchor="middle">channels</text><rect class="grp grp-new" x="20" y="334" width="940" height="152" rx="10"/><text class="tb" x="36" y="360">Shared services and gateways: owned by neither, used by both</text><rect class="bx" x="36" y="374" width="219.5" height="46" rx="6"/><text class="tb" x="46" y="394">tools-service</text><text class="ts" x="46" y="411">gateway, approvals, step-up</text><rect class="bx" x="265.5" y="374" width="219.5" height="46" rx="6"/><text class="tb" x="275.5" y="394">ops_hitl</text><text class="ts" x="275.5" y="411">Reviews, Cases, work items</text><rect class="bx" x="495" y="374" width="219.5" height="46" rx="6"/><text class="tb" x="505" y="394">ops_triggers</text><text class="ts" x="505" y="411">schedule, webhook, email, poll</text><rect class="bx" x="724.5" y="374" width="219.5" height="46" rx="6"/><text class="tb" x="734.5" y="394">platform-service</text><text class="ts" x="734.5" y="411">identity, teams, audit</text><rect class="bx" x="36" y="428" width="219.5" height="46" rx="6"/><text class="tb" x="46" y="448">models-service</text><text class="ts" x="46" y="465">model aliases, keys, cost</text><rect class="bx" x="265.5" y="428" width="219.5" height="46" rx="6"/><text class="tb" x="275.5" y="448">kb-service</text><text class="ts" x="275.5" y="465">knowledge bases</text><rect class="bx" x="495" y="428" width="219.5" height="46" rx="6"/><text class="tb" x="505" y="448">files-service</text><text class="ts" x="505" y="465">uploads, parsed pages</text><rect class="bx" x="724.5" y="428" width="219.5" height="46" rx="6"/><text class="tb" x="734.5" y="448">documents-service</text><text class="ts" x="734.5" y="465">document types, extraction</text><rect class="grp grp-host" x="20" y="506" width="940" height="80" rx="10"/><text class="tb" x="36" y="532">ops-host --services …   one program, any set of services per process</text><text class="ts" x="36" y="558">Dev and tests: everything in one process. Production: one process, or split by service. Services call each other</text><text class="ts" x="36" y="576">through generated clients: in-process when they share a process, HTTP with the service token when they do not.</text><path class="ln" d="M808.0399999999998,248 L808.0399999999998,284 L329.76,284 L329.76,166" stroke-dasharray="5 3" marker-end="url(#arrow)"/><text class="lbl" x="359.76" y="278">agents pack: a workflow step starts an agent run (public API)</text><path class="ln" d="M403.2,210 L403.2,304 L886.1444361090274,304 L886.1444361090274,118" stroke-dasharray="5 3" marker-end="url(#arrow)"/><text class="lbl" x="433.2" y="298">an agent calls a published workflow as a tool, through the data gateway</text><path class="ln" d="M240,264 L240,330" marker-end="url(#arrow)"/><text class="lbl" x="246" y="303">uses</text><path class="ln" d="M929.2,264 L929.2,330" marker-end="url(#arrow)"/><text class="lbl" x="935.2" y="303">uses</text></svg>
