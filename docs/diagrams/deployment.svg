<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 564" width="980" height="564" role="img" aria-label="Ops AI on one machine: Docker Compose behind one origin" class="ops-box-diagram"><title>Ops AI on one machine: Docker Compose behind one origin</title><style>svg{--d-fg:#1d1f22;--d-muted:#5d636b;--d-card:#ffffff;--d-soft:#f1f2f3;--d-accent:#2f5bd3;--d-new:#0f7a55;--d-new-soft:#e3f4ec;--d-pack:#5b3fd1;--d-pack-soft:#efeafc;--d-host:#1a5fb4;--d-host-soft:#e4edf9}@media (prefers-color-scheme: dark){svg{--d-fg:#e6e8eb;--d-muted:#a0a6ae;--d-card:#1c1f23;--d-soft:#22262b;--d-accent:#8fb0ff;--d-new:#5fd3a5;--d-new-soft:#17332a;--d-pack:#b7a6ff;--d-pack-soft:#2a2347;--d-host:#8ab6f2;--d-host-soft:#1c2a40}}
.ops-box-diagram{font-family:var(--ops-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);color:var(--d-fg)}
.ops-box-diagram .grp{fill:var(--d-card);stroke:var(--d-fg);stroke-width:1.2}
.ops-box-diagram .bx{fill:var(--d-card);stroke:var(--d-fg);stroke-width:1.2}
.ops-box-diagram .bx-port{fill:var(--d-soft);stroke:var(--d-fg);stroke-width:1}
.ops-box-diagram .grp-new,.ops-box-diagram .bx-new{fill:var(--d-new-soft);stroke:var(--d-new);stroke-width:1.4;stroke-dasharray:5 3}
.ops-box-diagram .bx-pack{fill:var(--d-pack-soft);stroke:var(--d-pack);stroke-width:1.3}
.ops-box-diagram .grp-host,.ops-box-diagram .bx-host{fill:var(--d-host-soft);stroke:var(--d-host);stroke-width:1.3}
.ops-box-diagram .grp-muted,.ops-box-diagram .bx-muted{fill:var(--d-soft);stroke:var(--d-muted);stroke-width:1;stroke-dasharray:2 3}
.ops-box-diagram .ln{fill:none;stroke:var(--d-fg);stroke-width:1.3}
.ops-box-diagram .arrow{fill:var(--d-fg)}
.ops-box-diagram text{fill:var(--d-fg)}
.ops-box-diagram .t{font-size:13px}
.ops-box-diagram .tb{font-size:13px;font-weight:600}
.ops-box-diagram .ts{font-size:11.5px;fill:var(--d-muted)}
.ops-box-diagram .lbl{font-size:11.5px;fill:var(--d-accent)}
.ops-box-diagram .lnk:hover rect{stroke:var(--d-accent);stroke-width:2}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect class="grp grp-muted" x="20" y="20" width="940" height="102" rx="10"/><text class="tb" x="36" y="46">People and callers reach one origin: https://&lt;OPS_PUBLIC_ORIGIN&gt;</text><rect class="bx" x="36" y="60" width="221.94725588025653" height="46" rx="6"/><text class="tb" x="46" y="80">Browsers</text><text class="ts" x="46" y="97">console and embedded chat</text><rect class="bx" x="267.94725588025653" y="60" width="425.5923022095509" height="46" rx="6"/><text class="tb" x="277.94725588025653" y="80">API and MCP clients</text><text class="ts" x="277.94725588025653" y="97">keys or tokens, per team</text><rect class="bx" x="703.5395580898074" y="60" width="240.46044191019243" height="46" rx="6"/><text class="tb" x="713.5395580898074" y="80">Mailboxes</text><text class="ts" x="713.5395580898074" y="97">Gmail, Microsoft 365, IMAP</text><rect class="grp grp-host" x="20" y="162" width="940" height="210" rx="10"/><text class="tb" x="36" y="188">The VM: Docker Compose, every image runs as uid 10001</text><rect class="bx" x="36" y="202" width="173.6" height="46" rx="6"/><text class="tb" x="46" y="222">proxy</text><text class="ts" x="46" y="239">Caddy :8080, the one origin</text><rect class="bx" x="219.6" y="202" width="173.6" height="46" rx="6"/><text class="tb" x="229.6" y="222">console</text><text class="ts" x="229.6" y="239">:3016, /</text><rect class="bx" x="403.2" y="202" width="173.6" height="46" rx="6"/><text class="tb" x="413.2" y="222">platform</text><text class="ts" x="413.2" y="239">:8710, /api/platform/</text><rect class="bx" x="586.8" y="202" width="173.6" height="46" rx="6"/><text class="tb" x="596.8" y="222">agents</text><text class="ts" x="596.8" y="239">:8700, /api/agents/</text><rect class="bx" x="770.4" y="202" width="173.6" height="46" rx="6"/><text class="tb" x="780.4" y="222">worker</text><text class="ts" x="780.4" y="239">workflow steps, no port</text><rect class="bx" x="36" y="256" width="173.6" height="46" rx="6"/><text class="tb" x="46" y="276">tools</text><text class="ts" x="46" y="293">:8720, /api/tools/</text><rect class="bx" x="219.6" y="256" width="173.6" height="46" rx="6"/><text class="tb" x="229.6" y="276">models</text><text class="ts" x="229.6" y="293">:8730, not routed</text><rect class="bx" x="403.2" y="256" width="173.6" height="46" rx="6"/><text class="tb" x="413.2" y="276">kb</text><text class="ts" x="413.2" y="293">:8740, /api/kb/</text><rect class="bx" x="586.8" y="256" width="173.6" height="46" rx="6"/><text class="tb" x="596.8" y="276">files</text><text class="ts" x="596.8" y="293">:8750, /api/files/</text><rect class="bx" x="770.4" y="256" width="173.6" height="46" rx="6"/><text class="tb" x="780.4" y="276">documents</text><text class="ts" x="780.4" y="293">:8760, /api/documents/</text><rect class="bx" x="36" y="310" width="173.6" height="46" rx="6"/><text class="tb" x="46" y="330">opa</text><text class="ts" x="46" y="347">:8181, tools only</text><rect class="bx" x="219.6" y="310" width="173.6" height="46" rx="6"/><text class="tb" x="229.6" y="330">migrate</text><text class="ts" x="229.6" y="347">one-shot, before the rest</text><rect class="grp" x="20" y="442" width="940" height="102" rx="10"/><text class="tb" x="36" y="468">Your network</text><rect class="bx" x="36" y="482" width="296" height="46" rx="6"/><text class="tb" x="46" y="502">PostgreSQL 16+</text><text class="ts" x="46" y="519">one login per service; Azure SQL planned</text><rect class="bx" x="342" y="482" width="296" height="46" rx="6"/><text class="tb" x="352" y="502">Model endpoint</text><text class="ts" x="352" y="519">any OpenAI-compatible URL</text><rect class="bx" x="648" y="482" width="296" height="46" rx="6"/><text class="tb" x="658" y="502">Bank systems</text><text class="ts" x="658" y="519">reached by tools-service only</text><path class="ln" d="M114,122 L114,158" marker-end="url(#arrow)"/><text class="lbl" x="120" y="146">HTTPS</text><path class="ln" d="M490,372 L490,438" marker-end="url(#arrow)"/><text class="lbl" x="496" y="411">each service its own database login</text></svg>
