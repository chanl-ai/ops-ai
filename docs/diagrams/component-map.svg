<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 722" width="980" height="722" role="img" aria-label="Ops AI components: callers, services and what they reach" class="ops-box-diagram"><title>Ops AI components: callers, services and what they reach</title><style>svg{--d-fg:#1d1f22;--d-muted:#5d636b;--d-card:#ffffff;--d-soft:#f1f2f3;--d-accent:#2f5bd3;--d-new:#0f7a55;--d-new-soft:#e3f4ec;--d-pack:#5b3fd1;--d-pack-soft:#efeafc;--d-host:#1a5fb4;--d-host-soft:#e4edf9;--d-green:#12804a;--d-green-soft:#e2f3ea;--d-indigo:#4a55d4;--d-indigo-soft:#eceefd;--d-violet:#7a44c8;--d-violet-soft:#f2ebfc;--d-teal:#0b7a83;--d-teal-soft:#e0f2f3;--d-blue:#1d6fd1;--d-blue-soft:#e4effc;--d-amber:#a5650b;--d-amber-soft:#fcf0dc;--d-rose:#b8324f;--d-rose-soft:#fbe8ed;--d-slate:#4c5868;--d-slate-soft:#edf0f4}@media (prefers-color-scheme: dark){svg{--d-fg:#e6e8eb;--d-muted:#a0a6ae;--d-card:#1c1f23;--d-soft:#22262b;--d-accent:#8fb0ff;--d-new:#5fd3a5;--d-new-soft:#17332a;--d-pack:#b7a6ff;--d-pack-soft:#2a2347;--d-host:#8ab6f2;--d-host-soft:#1c2a40;--d-green:#4fcf8c;--d-green-soft:#11291d;--d-indigo:#929bff;--d-indigo-soft:#1b1f3d;--d-violet:#c19bff;--d-violet-soft:#251a3a;--d-teal:#5ccfd8;--d-teal-soft:#0f2a2d;--d-blue:#6fb0ff;--d-blue-soft:#11243b;--d-amber:#f0b45a;--d-amber-soft:#2e220f;--d-rose:#ff8fa8;--d-rose-soft:#36161f;--d-slate:#a9b5c5;--d-slate-soft:#1c232d}}
.ops-box-diagram{font-family:var(--ops-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);color:var(--d-fg)}
.ops-box-diagram .grp{fill:var(--d-card);stroke:var(--d-fg);stroke-width:1.2}
.ops-box-diagram .bx{fill:var(--d-card);stroke:var(--d-fg);stroke-width:1.2}
.ops-box-diagram .bx-port{fill:var(--d-soft);stroke:var(--d-fg);stroke-width:1}
.ops-box-diagram .grp-new,.ops-box-diagram .bx-new{fill:var(--d-new-soft);stroke:var(--d-new);stroke-width:1.4;stroke-dasharray:5 3}
.ops-box-diagram .bx-pack{fill:var(--d-pack-soft);stroke:var(--d-pack);stroke-width:1.3}
.ops-box-diagram .grp-host,.ops-box-diagram .bx-host{fill:var(--d-host-soft);stroke:var(--d-host);stroke-width:1.3}
.ops-box-diagram .grp-muted,.ops-box-diagram .bx-muted{fill:var(--d-soft);stroke:var(--d-muted);stroke-width:1;stroke-dasharray:2 3}
.ops-box-diagram .ln{fill:none;stroke:var(--d-fg);stroke-width:1.3}
.ops-box-diagram .arrow{fill:var(--d-fg)}
.ops-box-diagram:not(.ops-free) text{fill:var(--d-fg)}
.ops-box-diagram .t{font-size:13px}
.ops-box-diagram .tb{font-size:13px;font-weight:600}
.ops-box-diagram .ts{font-size:11.5px;fill:var(--d-muted)}
.ops-box-diagram .lbl{font-size:11.5px;fill:var(--d-accent)}
.ops-box-diagram .lnk:hover rect{stroke:var(--d-accent);stroke-width:2}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect class="grp grp-muted" x="20" y="20" width="940" height="120" rx="10"/><text class="tb" x="36" y="46">Callers</text><text class="ts" x="36" y="64">every call carries a person's token, an API key or a service token, and a team</text><rect class="bx" x="36" y="78" width="155.72730617124986" height="46" rx="6"/><text class="tb" x="46" y="98">Console</text><text class="ts" x="46" y="115">people: build, run, decide</text><rect class="bx" x="201.72730617124986" y="78" width="240.75756460958337" height="46" rx="6"/><text class="tb" x="211.72730617124986" y="98">Embedded chat</text><text class="ts" x="211.72730617124986" y="115">on a bank's intranet page</text><rect class="bx" x="452.48487078083326" y="78" width="155.72730617124986" height="46" rx="6"/><text class="tb" x="462.48487078083326" y="98">Mailbox</text><text class="ts" x="462.48487078083326" y="115">email in, replies out</text><rect class="bx" x="618.2121769520832" y="78" width="325.78782304791685" height="46" rx="6"/><text class="tb" x="628.2121769520832" y="98">API and MCP clients</text><text class="ts" x="628.2121769520832" y="115">scripts, assistants</text><rect class="grp" x="20" y="180" width="586.6666666666666" height="178" rx="10"/><text class="tb" x="36" y="206">agents-service</text><text class="ts" x="36" y="224">runs every agent turn and every workflow step</text><rect class="bx" x="36" y="238" width="272.3333333333333" height="46" rx="6"/><text class="tb" x="46" y="258">Agents and chat</text><text class="ts" x="46" y="275">kernel, threads, runs, budgets</text><rect class="bx" x="318.3333333333333" y="238" width="272.3333333333333" height="46" rx="6"/><text class="tb" x="328.3333333333333" y="258">Workflow runner</text><text class="ts" x="328.3333333333333" y="275">ops_engine: journal, queue, workers</text><rect class="bx" x="36" y="296" width="198.00927285817133" height="46" rx="6"/><text class="tb" x="46" y="316">Channels</text><text class="ts" x="46" y="333">mailbox, widget, MCP, API</text><rect class="bx" x="244.00927285817133" y="296" width="346.6573938084953" height="46" rx="6"/><text class="tb" x="254.00927285817133" y="316">Reviews and Cases</text><text class="ts" x="254.00927285817133" y="333">decisions; ops_hitl planned</text><rect class="grp" x="666.6666666666666" y="180" width="293.3333333333333" height="178" rx="10"/><text class="tb" x="682.6666666666666" y="206">platform-service</text><text class="ts" x="682.6666666666666" y="224">the only issuer of identity tokens</text><rect class="bx" x="682.6666666666666" y="238" width="261.3333333333333" height="46" rx="6"/><text class="tb" x="692.6666666666666" y="258">Identity</text><text class="ts" x="692.6666666666666" y="275">sign-in, teams, roles, audit</text><rect class="bx" x="682.6666666666666" y="296" width="261.3333333333333" height="46" rx="6"/><text class="tb" x="692.6666666666666" y="316">API keys</text><text class="ts" x="692.6666666666666" y="333">and the public keys (JWKS)</text><rect class="grp grp-new" x="20" y="428" width="940" height="102" rx="10"/><text class="tb" x="36" y="454">Shared services: one database chain each, called through typed clients</text><rect class="bx" x="36" y="468" width="173.6" height="46" rx="6"/><text class="tb" x="46" y="488">tools-service</text><text class="ts" x="46" y="505">data gateway</text><rect class="bx" x="219.6" y="468" width="173.6" height="46" rx="6"/><text class="tb" x="229.6" y="488">models-service</text><text class="ts" x="229.6" y="505">AI gateway</text><rect class="bx" x="403.2" y="468" width="173.6" height="46" rx="6"/><text class="tb" x="413.2" y="488">kb-service</text><text class="ts" x="413.2" y="505">knowledge</text><rect class="bx" x="586.8" y="468" width="173.6" height="46" rx="6"/><text class="tb" x="596.8" y="488">files-service</text><text class="ts" x="596.8" y="505">file bytes</text><rect class="bx" x="770.4" y="468" width="173.6" height="46" rx="6"/><text class="tb" x="780.4" y="488">documents-service</text><text class="ts" x="780.4" y="505">what a file says</text><rect class="grp grp-host" x="20" y="600" width="940" height="102" rx="10"/><text class="tb" x="36" y="626">Outside the platform</text><rect class="bx" x="36" y="640" width="219.5" height="46" rx="6"/><text class="tb" x="46" y="660">Bank systems</text><text class="ts" x="46" y="677">OpenAPI and MCP, test and live</text><rect class="bx" x="265.5" y="640" width="219.5" height="46" rx="6"/><text class="tb" x="275.5" y="660">Model providers</text><text class="ts" x="275.5" y="677">OpenAI-compatible, by alias</text><rect class="bx" x="495" y="640" width="219.5" height="46" rx="6"/><text class="tb" x="505" y="660">PostgreSQL or SQL Server</text><text class="ts" x="505" y="677">row security per tenant</text><rect class="bx" x="724.5" y="640" width="219.5" height="46" rx="6"/><text class="tb" x="734.5" y="660">OPA</text><text class="ts" x="734.5" y="677">tool policy, beside tools-service</text><path class="ln" d="M330.2,140 L330.2,176" marker-end="url(#arrow)"/><text class="lbl" x="336.2" y="164">runs, chats, decisions</text><path class="ln" d="M313.3333333333333,358 L313.3333333333333,424" marker-end="url(#arrow)"/><text class="lbl" x="319.3333333333333" y="397">every tool and model call</text><path class="ln" d="M122.8,514 L122.8,596" marker-end="url(#arrow)"/><text class="lbl" x="128.8" y="561">approval token per write</text><path class="ln" d="M306.4,514 L306.4,596" marker-end="url(#arrow)"/><text class="lbl" x="312.4" y="561">key and budget per caller</text></svg>
