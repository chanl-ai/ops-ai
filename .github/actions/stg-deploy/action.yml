# Puts one commit on staging with `make stg-deploy REF=<sha>`, the one deploy path (docs/deploy/fly-staging.md). Used by
# ci.yml (every merge to develop, after ci-ok) and release-tag.yml (main, or a hand-started run). The caller checks the
# repository out first and sets these in the job's env, from the "staging" environment's secrets and variables:
#   FLY_API_TOKEN       deploy tokens for the two apps below, joined by a comma
#   STG_APP, STG_DB_APP the one-machine staging app and its Postgres app (variables); STG_APP_PREFIX optional
#   STAGING_DB_URL      the attach's superuser URL, contents of staging-db-url.txt (grants are applied with it)
#   STAGING_ADMIN_ENV   the bootstrap admin's lines, contents of staging-admin.env (the click walk signs in with it)
# Without any of them the deploy is skipped with a notice. Nothing here prints a secret.
name: stg-deploy
description: Deploy one commit to the staging Fly app
inputs:
  sha:
    description: Commit to deploy
    required: true
runs:
  using: composite
  steps:
    - id: ready
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
      run: |
        missing=""
        [ -n "$FLY_API_TOKEN" ] || missing="$missing FLY_API_TOKEN"
        [ -n "$STG_APP" ] || missing="$missing vars.STG_APP"
        [ -n "$STG_DB_APP" ] || missing="$missing vars.STG_DB_APP"
        [ -n "$STAGING_DB_URL" ] || missing="$missing STAGING_DB_URL"
        [ -n "$STAGING_ADMIN_ENV" ] || missing="$missing STAGING_ADMIN_ENV"
        if [ -n "$missing" ]; then
          echo "::notice title=Staging not deployed::Secrets or variables missing in the staging environment:$missing. Staging keeps what it runs; $SHA is not deployed. See .github/actions/stg-deploy/action.yml."
          echo "ready=false" >> "$GITHUB_OUTPUT"
        else
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA to the staging app"
        fi
    - if: steps.ready.outputs.ready == 'true'
      uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
    - if: steps.ready.outputs.ready == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - if: steps.ready.outputs.ready == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.4.0
    - if: steps.ready.outputs.ready == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm
    - name: Tools the deploy runs (psql for grants, uv for the DDL, Chromium for the click walk)
      if: steps.ready.outputs.ready == 'true'
      shell: bash
      run: |
        sudo apt-get update -q && sudo apt-get install -yq postgresql-client netcat-openbsd >/dev/null
        uv sync --frozen --quiet
        pnpm install --frozen-lockfile
        pnpm --filter @ops-ai/usecase-runner exec playwright install --with-deps chromium
    - name: Staging config from secrets
      if: steps.ready.outputs.ready == 'true'
      shell: bash
      run: |
        umask 077
        # stg_env.sh and stg_deploy.sh read these from OPS_STAGING_CONFIG (default ~/.config/ops-ai); never printed.
        OPS_STAGING_CONFIG="$RUNNER_TEMP/ops-ai"
        echo "OPS_STAGING_CONFIG=$OPS_STAGING_CONFIG" >> "$GITHUB_ENV"
        mkdir -p "$OPS_STAGING_CONFIG"
        printf '%s\n' "$STAGING_DB_URL" > "$OPS_STAGING_CONFIG/staging-db-url.txt"
        printf '%s\n' "$STAGING_ADMIN_ENV" > "$OPS_STAGING_CONFIG/staging-admin.env"
        # App names, not secrets.
        printf 'STG_APP=%s\nSTG_DB_APP=%s\n' "$STG_APP" "$STG_DB_APP" > "$OPS_STAGING_CONFIG/staging.env"
        [ -z "$STG_APP_PREFIX" ] || printf 'STG_APP_PREFIX=%s\n' "$STG_APP_PREFIX" >> "$OPS_STAGING_CONFIG/staging.env"
    - name: Deploy to staging
      if: steps.ready.outputs.ready == 'true'
      shell: bash
      env:
        REF: ${{ inputs.sha }}
      run: make -s stg-deploy REF="$REF"
