# Every merge to main is tagged `vYYYY-MM-DD.N` (What's new shows it). Staging runs develop (ci.yml deploys each merge
# there), so a merge to main does not touch staging. Each step is a make target that runs the same way locally:
# `make release-tag` (DRY=1 prints the next name) and `make stg-deploy REF=<sha>`.
#
# Override: run this workflow by hand with a ref to put that ref on staging (a hotfix check); set the repository
# variable STAGING_HOLD (any value, the reason) to stop develop merges from replacing it.
#
# The staging deploy is .github/actions/stg-deploy, which lists the secrets and variables it needs. They live in the
# GitHub environment "staging"; without them the deploy is skipped with a notice and the tag still lands. ci.yml uses
# the same action to deploy every merge to develop; both share the concurrency group staging-deploy.
name: release-tag

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to put on staging (default: main)"
        required: false
        default: main

permissions:
  contents: read

jobs:
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the date tag
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the merge
        env:
          REF: ${{ github.sha }}
        run: make -s release-tag

  staging:
    needs: tag
    # Only on a hand-started run: staging otherwise follows develop.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    # One deploy at a time; a merge that lands mid-deploy waits, then deploys its own commit.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      STG_APP: ${{ vars.STG_APP }}
      STG_DB_APP: ${{ vars.STG_DB_APP }}
      STG_APP_PREFIX: ${{ vars.STG_APP_PREFIX }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      STAGING_ADMIN_ENV: ${{ secrets.STAGING_ADMIN_ENV }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: What to deploy
        id: plan
        env:
          ASKED: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
        run: |
          sha=$(git rev-parse --verify -q "$ASKED^{commit}" || git rev-parse --verify -q "origin/$ASKED^{commit}") \
            || { echo "::error title=Staging not deployed::No commit named $ASKED"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/stg-deploy
        with:
          sha: ${{ steps.plan.outputs.sha }}
