# Every merge of a release/* or hotfix/* branch into main is tagged `vX.Y.Z` (the version in the branch name; What's new
# shows it) with `make release-tag`, which runs the same way locally (DRY=1 prints the name). A push to main that is
# no release or hotfix merge gets no tag. The tag push made with the workflow token starts no workflow of its own, so
# this one starts sdk-publish.yml and release-images.yml on the new tag with workflow_dispatch, which the token may
# start. Staging runs develop and the release branch under test, so a merge to main does not touch it; to put any
# other commit on staging, run deploy-staging.yml by hand (`make stg-deploy-ci REF=<ref>`).
name: release-tag

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the version tag
      actions: write # starts sdk-publish.yml and release-images.yml on it
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the merge
        id: tag
        env:
          REF: ${{ github.sha }}
        run: |
          out=$(make -s release-tag)
          echo "$out"
          case "$out" in
            *"pushed to"*) echo "tag=$(git tag --points-at "$REF" --list 'v[0-9]*.[0-9]*.[0-9]*' | head -1)" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Publish the SDKs and build the images for the new tag
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run sdk-publish.yml --ref "$TAG"
          gh workflow run release-images.yml --ref "$TAG"
