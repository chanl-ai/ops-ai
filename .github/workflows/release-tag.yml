# Every merge to main is tagged `vYYYY-MM-DD.N` (What's new shows it, c-510) and then deployed to staging, so staging
# runs main unless someone overrides it. Each step is a make target that runs the same way locally: `make release-tag`
# (DRY=1 prints the next name) and `make stg-deploy REF=<sha>`.
#
# Override: run this workflow by hand with a ref to put that ref on staging; set the repository variable STAGING_HOLD
# (any value, the reason) to stop merges from replacing it, and clear it to go back to main.
#
# Staging needs three repository secrets; without any of them the deploy is skipped with a notice and the tag still lands:
#   FLY_API_TOKEN       deploy tokens for <your-app>-one and <your-app>-db, joined by a comma (docs/deploy/fly-staging.md)
#   STAGING_DB_URL      the staging attach's superuser URL (~/.config/ops-ai/staging-db-url.txt): grants are applied with it
#   STAGING_ADMIN_ENV   the bootstrap admin's lines (~/.config/ops-ai/staging-admin.env): the click walk signs in with it
name: release-tag

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to put on staging (default: main)"
        required: false
        default: main

permissions:
  contents: write

jobs:
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the merge
        env:
          REF: ${{ github.sha }}
        run: make -s release-tag

  staging:
    needs: tag
    # After the tag on a merge (unless staging is held), or on a hand-started run whatever the hold says.
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.tag.result == 'success' && vars.STAGING_HOLD == '') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One deploy at a time; a merge that lands mid-deploy waits, then deploys its own commit.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      STAGING_ADMIN_ENV: ${{ secrets.STAGING_ADMIN_ENV }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What to deploy
        id: plan
        env:
          ASKED: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
        run: |
          sha=$(git rev-parse --verify -q "$ASKED^{commit}" || git rev-parse --verify -q "origin/$ASKED^{commit}") \
            || { echo "::error title=Staging not deployed::No commit named $ASKED"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          missing=""
          [ -n "$FLY_API_TOKEN" ] || missing="$missing FLY_API_TOKEN"
          [ -n "$STAGING_DB_URL" ] || missing="$missing STAGING_DB_URL"
          [ -n "$STAGING_ADMIN_ENV" ] || missing="$missing STAGING_ADMIN_ENV"
          if [ -n "$missing" ]; then
            echo "::notice title=Staging not deployed::Repository secrets missing:$missing. Staging keeps what it runs; $sha is not deployed. See the header of .github/workflows/release-tag.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Deploying $ASKED ($sha) to <your-app>-one"
          fi
      - if: steps.plan.outputs.ready == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.plan.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v5
      - if: steps.plan.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.plan.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Tools the deploy runs (psql for grants, uv for the DDL, Chromium for the click walk)
        if: steps.plan.outputs.ready == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client netcat-openbsd >/dev/null
          uv sync --frozen --quiet
          pnpm install --frozen-lockfile
          pnpm --filter @ops-ai/usecase-runner exec playwright install --with-deps chromium
      - name: Staging config from secrets
        if: steps.plan.outputs.ready == 'true'
        run: |
          umask 077
          # stg_deploy.sh reads its secrets from this directory (default ~/.config/ops-ai); it never prints them.
          OPS_STAGING_CONFIG="$RUNNER_TEMP/ops-ai"
          echo "OPS_STAGING_CONFIG=$OPS_STAGING_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$OPS_STAGING_CONFIG"
          printf '%s\n' "$STAGING_DB_URL" > "$OPS_STAGING_CONFIG/staging-db-url.txt"
          printf '%s\n' "$STAGING_ADMIN_ENV" > "$OPS_STAGING_CONFIG/staging-admin.env"
      - name: Deploy to staging
        if: steps.plan.outputs.ready == 'true'
        env:
          REF: ${{ steps.plan.outputs.sha }}
        run: make -s stg-deploy REF="$REF"
