# Every merge to main is tagged `vYYYY-MM-DD.N` (What's new shows it) with `make release-tag`, which runs the same way
# locally (DRY=1 prints the next name). Staging runs develop, so a merge to main does not touch it; to put a release or
# any other commit on staging, run deploy-staging.yml by hand (`make stg-deploy-ci REF=<ref>`).
name: release-tag

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the date tag
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the merge
        env:
          REF: ${{ github.sha }}
        run: make -s release-tag
