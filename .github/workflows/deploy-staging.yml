# The one way a commit reaches staging (docs/deploy/fly-staging.md). Two triggers, one job:
#   - ci.yml calls it after ci-ok passes on a push to develop, with that commit;
#   - anyone with write access runs it by hand (Actions, deploy-staging, Run workflow, or `make stg-deploy-ci REF=`)
#     with a branch, tag or commit.
# A merge to develop is not deployed while staging is frozen: a release/X.Y.Z or hotfix/* branch exists on origin (a
# release under test must not be overwritten; the permanent train, release/current, does not freeze it, and the owner
# sets STAGING_HOLD while a hand-started deploy of the train is under test) or the repository variable STAGING_HOLD is set (`X.Y.Z: reason`; it is ignored once tag vX.Y.Z exists, and a skipped deploy fails the job). A push
# to a release or hotfix branch is deployed, and so is a hand-started run, which says in the summary what it overrode.
#
# The deploy is .github/actions/stg-deploy (`make stg-deploy REF=<sha>`): build once per commit, migrate, grants, every
# process up, OCR, plugins, a signed-in request, then the click walk and the smoke check (skip_walk leaves both out). When a step fails
# after the machine was replaced, the job redeploys the release staging ran before (`make stg-rollback TO=`) and fails.
name: deploy-staging

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, tag or branch to deploy
        type: string
        required: true
      skip_walk:
        description: Leave out the click walk and the smoke check after it
        type: boolean
        default: false
      reason:
        description: Why, shown in the summary
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to deploy
        type: string
        default: develop
      skip_walk:
        description: Leave out the click walk and the smoke check after it (the signed-in request still runs)
        type: boolean
        default: false
      reason:
        description: Why, shown in the summary
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: staging
      url: https://${{ vars.STG_APP }}.fly.dev
    permissions:
      contents: read
    # One deploy at a time, from either trigger. A run that is waiting is replaced by a newer one; a running one finishes.
    # Set on the job: concurrency at the top of a called workflow does not apply.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      STG_APP: ${{ vars.STG_APP }}
      # The one host a use case or walk may sign in to and write on (docs/usecases/README.md); exact, never a pattern.
      OPS_USECASE_STAGING_HOST: ${{ vars.STG_APP }}.fly.dev
      STG_DB_APP: ${{ vars.STG_DB_APP }}
      STG_APP_PREFIX: ${{ vars.STG_APP_PREFIX }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      STAGING_ADMIN_ENV: ${{ secrets.STAGING_ADMIN_ENV }}
      STAGING_ROLES_ENV: ${{ secrets.STAGING_ROLES_ENV }}
      SKIP_WALK: ${{ inputs.skip_walk && '1' || '0' }}
      # Inside a called workflow event_name is the caller's (push), so only a hand-started run is manual.
      MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: What to deploy, and is staging pinned?
        id: plan
        env:
          ASKED: ${{ inputs.ref }}
          HOLD: ${{ vars.STAGING_HOLD }}
        run: |
          started=$(date +%s); echo "STG_STARTED=$started" >> "$GITHUB_ENV"
          sha=$(git rev-parse --verify -q "$ASKED^{commit}" || git rev-parse --verify -q "origin/$ASKED^{commit}") \
            || { echo "::error title=Staging not deployed::No commit named $ASKED"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # The pin file stg_deploy.sh reads lives on the owner's machine, so the runner asks the remote instead.
          # The reasons a develop merge is not deployed (a release or hotfix branch on origin, STAGING_HOLD) are decided in
          # scripts/staging_hold.py. Only a develop push is frozen by a branch: a push to the release or hotfix branch
          # itself is the deploy being tested.
          branches=""
          case "$GITHUB_REF" in
            refs/heads/release/* | refs/heads/hotfix/*) ;;
            *) branches=$(git ls-remote --heads origin 'refs/heads/release/[0-9]*' 'refs/heads/hotfix/*' | sed 's|.*refs/heads/||' | tr '\n' ' ') ;;
          esac
          verdict=$(HOLD="$HOLD" BRANCHES="${branches% }" python3 scripts/staging_hold.py) || true
          state=$(printf '%s\n' "$verdict" | sed -n 's/^state=//p'); text=$(printf '%s\n' "$verdict" | sed -n 's/^text=//p')
          pin=$(printf '%s\n' "$verdict" | sed -n 's/^pin=//p')
          [ -n "$state" ] || { echo "::error title=Staging hold unreadable::scripts/staging_hold.py printed no state"; exit 1; }
          case "$state" in
            invalid) echo "::error title=Staging hold invalid::$text"; exit 1 ;;
            ignored) echo "::notice title=Stale staging hold ignored::$text. Clear the variable." ;;
          esac
          held=false
          [ -z "$pin" ] || held=true
          go=true
          if [ -n "$pin" ] && [ "$MANUAL" = true ]; then
            note="Started by hand, so it overrides the pin: $pin."
            echo "::warning title=Staging pin overridden::$note"
          elif [ -n "$pin" ]; then
            go=false
            note="Not deployed: $pin. Clear STAGING_HOLD, or merge the release or hotfix branch and delete it; the next merge to develop deploys."
            echo "::notice title=Staging not deployed::$note"
          else
            note=""
          fi
          { echo "go=$go"; echo "held=$held"; echo "hold_note=$note"; echo "note=$note"; } >> "$GITHUB_OUTPUT"
      - name: Deploy
        id: deploy
        if: steps.plan.outputs.go == 'true'
        uses: ./.github/actions/stg-deploy
        with:
          sha: ${{ steps.plan.outputs.sha }}
      - name: Roll back to the release before
        id: rollback
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/stg-deploy.log"
          if ! grep -q '^stg-deploy: replacing the machine' "$log" 2>/dev/null; then
            echo "result=not needed: the failure came before the machine was replaced" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${STG_PREVIOUS:-}" ]; then
            echo "result=not possible: the release before this deploy is unknown" >> "$GITHUB_OUTPUT"; exit 1
          fi
          case "$SHA" in "$STG_PREVIOUS"*)
            echo "result=not possible: the release before was this same commit" >> "$GITHUB_OUTPUT"; exit 1 ;;
          esac
          # A rollback swaps the image and waits for every process; it runs no grants, OCR, plugin, sign-in or walk step.
          if make -s stg-rollback TO="$STG_PREVIOUS" 2>&1 | tee "$RUNNER_TEMP/stg-rollback.log"; then
            echo "result=done: staging runs $STG_PREVIOUS again, every process up" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED: staging may be down; run make stg-health" >> "$GITHUB_OUTPUT"; exit 1
          fi
      - name: Summary
        if: always()
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          ASKED: ${{ inputs.ref }}
          REASON: ${{ inputs.reason }}
          NOTE: ${{ steps.plan.outputs.note }}
          GO: ${{ steps.plan.outputs.go }}
          OUTCOME: ${{ steps.deploy.outcome }}
          ROLLBACK: ${{ steps.rollback.outputs.result }}
          ACTOR: ${{ github.actor }}
        run: |
          log="$RUNNER_TEMP/stg-deploy.log"
          url="https://$STG_APP.fly.dev"
          if [ "$MANUAL" = true ]; then trigger="started by hand by @$ACTOR"; else trigger="merge to develop, after ci-ok"; fi
          case "$GO/$OUTCOME" in
            true/success) result="deployed and checked" ;;
            true/failure) result="FAILED" ;;
            false/*) result="not deployed (pinned)" ;;
            *) result="not run" ;;
          esac
          {
            echo "## Staging: $result"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | ${SHA:+[\`${SHA:0:8}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA)} (asked: \`$ASKED\`) |"
            echo "| Trigger | $trigger |"
            [ -z "$REASON" ] || echo "| Reason | $REASON |"
            [ -z "$NOTE" ] || echo "| Pin | $NOTE |"
            echo "| URL | $url |"
            build="built on this run"
            [ "${SKIP_BUILD:-0}" != 1 ] || build="reused the image an earlier release pushed"
            walk=$(grep -o 'click walk ([0-9]* OK, [0-9]* FAIL)' "$log" 2>/dev/null | tail -1)
            smoke=$(grep '^smoke: ' "$log" 2>/dev/null | tail -1 | sed 's/^smoke: //')
            [ "$SKIP_WALK" != 1 ] || { walk="skipped on request"; smoke="skipped on request (skip_walk leaves out the smoke check too)"; }
            echo "| Build | $build |"
            echo "| Click walk | ${walk:-did not run} |"
            echo "| Smoke check | ${smoke:-did not run} |"
            [ -z "$ROLLBACK" ] || echo "| Rollback | $ROLLBACK |"
            echo "| Job time | $(( $(date +%s) - ${STG_STARTED:-$(date +%s)} )) s |"
            if [ -s "$log" ]; then
              echo
              echo "| Step | Seconds |"
              echo "|---|---|"
              sed -nE 's/^stg-deploy: (.*) took ([0-9]+)s$/| \1 | \2 |/p' "$log"
              failures=$(grep -E '^(FAIL|stg-deploy: .*(failed|differ|references))' "$log" | head -20 || true)
              fence='```'
              if [ -n "$failures" ]; then printf '\n%s\n%s\n%s\n' "$fence" "$failures" "$fence"; fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: A freeze or hold that skipped the deploy is a red job
        # Green must mean deployed. A deploy skipped by a release or hotfix branch or by STAGING_HOLD fails the job with the hold text, so a stale
        # variable or branch cannot sit behind a green run (a hand-started run overrides the pin and never gets here).
        if: always() && steps.plan.outputs.go == 'false' && steps.plan.outputs.held == 'true'
        env:
          NOTE: ${{ steps.plan.outputs.hold_note }}
        run: |
          echo "::error title=Staging not deployed::$NOTE"
          exit 1
