# Publishes the SDKs (sdk/python to PyPI as ops-ai, sdk/typescript to npm as @chanl-ai/ops-ai) when the version in a
# package's file is not on its registry yet. A release is a commit that raises that version; the release notes name
# the platform tag it was tested on.
#
# Every run is a dry run (build, check, `--dry-run`) until the owner turns publishing on: set the repository variable
# SDK_PUBLISH to 1 and the secrets NPM_TOKEN (an npm automation token for the @chanl-ai scope) and PYPI_TOKEN.
#
# Every run, dry or not, also writes a CycloneDX SBOM of the package as a user installs it (the package and its
# runtime dependencies), signs each built file with keyless cosign (a .sigstore.json bundle beside it) and records a
# GitHub build provenance attestation for it. When a version is published, the files, bundles and SBOM go on a draft
# GitHub release named sdk-python-v<version> or sdk-typescript-v<version>, and npm also gets its own provenance.
name: sdk-publish

on:
  push:
    branches: [main]
    paths: ["sdk/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write # keyless signing and provenance
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # uv never downloads a Python here (python-downloads = "manual" in pyproject.toml), so the runner provides it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Build
        run: uv build --out-dir dist sdk/python
      - name: Install the wheel in an empty environment and import it
        run: |
          uv venv /tmp/smoke && VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/python -c "import ops_ai; print(ops_ai.__version__)"
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' sdk/python/pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/trivy
      - name: SBOM of the installed package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p sbom
          trivy rootfs --quiet --format cyclonedx --output "sbom/ops-ai-python-$VERSION.cdx.json" /tmp/smoke
          jq -r '.components[] | "\(.name) \(.version)"' "sbom/ops-ai-python-$VERSION.cdx.json" | sort | tr '\n' ';'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign and verify
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sdk-publish.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-python-${{ steps.version.outputs.version }}
          path: |
            dist/
            sbom/
      - name: Publish when this version is new
        id: publish
        env:
          PUBLISH: ${{ vars.SDK_PUBLISH == '1' && secrets.PYPI_TOKEN != '' }}
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if curl -sf "https://pypi.org/pypi/ops-ai/$VERSION/json" >/dev/null; then echo "ops-ai $VERSION is on PyPI already"; exit 0; fi
          if [ "$PUBLISH" != true ]; then echo "dry run: would publish ops-ai $VERSION"; ls dist; exit 0; fi
          uv publish dist/*.whl dist/*.tar.gz
          echo "published=true" >> "$GITHUB_OUTPUT"

  typescript:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write # keyless signing, provenance and npm provenance
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in package.json; naming one here as well fails the step.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install, build and test
        run: pnpm install --frozen-lockfile --filter @chanl-ai/ops-ai && pnpm --filter @chanl-ai/ops-ai test
      - id: version
        working-directory: sdk/typescript
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Pack and install the tarball in an empty folder
        run: |
          # pnpm pack, as pnpm publish does: it rewrites workspace: ranges that npm pack would leave in.
          mkdir -p dist && (cd sdk/typescript && pnpm pack --pack-destination ../../dist)
          # pnpm add of the exact local tarball: no registry name or range is resolved for the package itself, and its
          # install scripts do not run.
          mkdir -p /tmp/npm-smoke && echo '{"private":true}' > /tmp/npm-smoke/package.json
          (cd /tmp/npm-smoke && pnpm add --ignore-scripts --prod "$OLDPWD"/dist/*.tgz)
      - uses: ./.github/actions/trivy
      - name: SBOM of the installed package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p sbom
          trivy rootfs --quiet --format cyclonedx --output "sbom/ops-ai-typescript-$VERSION.cdx.json" /tmp/npm-smoke
          jq -r '.components[] | "\(.name) \(.version)"' "sbom/ops-ai-typescript-$VERSION.cdx.json" | sort | tr '\n' ';'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign and verify
        run: |
          for f in dist/*.tgz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sdk-publish.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-typescript-${{ steps.version.outputs.version }}
          path: |
            dist/
            sbom/
      - name: Publish when this version is new
        id: publish
        working-directory: sdk/typescript
        env:
          PUBLISH: ${{ vars.SDK_PUBLISH == '1' && secrets.NPM_TOKEN != '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@chanl-ai/ops-ai@$VERSION" version >/dev/null 2>&1; then echo "@chanl-ai/ops-ai $VERSION is on npm already"; exit 0; fi
          # pnpm publish, never npm publish: npm leaves workspace: ranges in a published package.
          if [ "$PUBLISH" != true ]; then pnpm publish --dry-run --no-git-checks; exit 0; fi
          NPM_CONFIG_PROVENANCE=true pnpm publish --access public --no-git-checks
          echo "published=true" >> "$GITHUB_OUTPUT"

  github-release:
    # Its own job, so the only step holding a token that can write the repository is the release upload, and only
    # after a version was published.
    needs: [python, typescript]
    if: needs.python.outputs.published == 'true' || needs.typescript.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      matrix:
        sdk: [python, typescript]
    steps:
      - id: pick
        env:
          SDK: ${{ matrix.sdk }}
          PY_PUBLISHED: ${{ needs.python.outputs.published }}
          PY_VERSION: ${{ needs.python.outputs.version }}
          TS_PUBLISHED: ${{ needs.typescript.outputs.published }}
          TS_VERSION: ${{ needs.typescript.outputs.version }}
        run: |
          if [ "$SDK" = python ]; then p=$PY_PUBLISHED; v=$PY_VERSION; else p=$TS_PUBLISHED; v=$TS_VERSION; fi
          echo "published=$p" >> "$GITHUB_OUTPUT"; echo "version=$v" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.published == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-${{ matrix.sdk }}-${{ steps.pick.outputs.version }}
      - if: steps.pick.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SDK: ${{ matrix.sdk }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          gh release create "sdk-$SDK-v$VERSION" --draft --target "$GITHUB_SHA" --title "$SDK SDK $VERSION" \
            --notes "The $SDK SDK $VERSION. Signed files (.sigstore.json bundles) and the CycloneDX SBOM are attached." \
            dist/* sbom/*
