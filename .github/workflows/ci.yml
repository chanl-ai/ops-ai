# Pull request checks on GitHub-hosted runners only, since a fork's pull request runs its own code.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The suites reach PostgreSQL, OPA and the mail servers as side containers on localhost.
  OPS_INFRA: external
  OPS_DATABASE_URL: postgresql+asyncpg://ops:ops@localhost:5477/ops_runtime
  OPS_TEST_DATABASE_URL: postgresql+asyncpg://ops:ops@localhost:5477/ops_test
  OPS_OPA_URL: http://127.0.0.1:8181
  OPS_SMTP_HOST: 127.0.0.1
  OPS_GREENMAIL_HOST: 127.0.0.1
  OPS_MAILPIT_HOST: 127.0.0.1

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}
      services: ${{ steps.plan.outputs.services }}
      packages: ${{ steps.plan.outputs.packages }}
      console: ${{ steps.plan.outputs.console }}
      docs: ${{ steps.plan.outputs.docs }}
      scripts: ${{ steps.plan.outputs.scripts }}
      service_jobs: ${{ steps.plan.outputs.service_jobs }}
      repo_pool: ${{ steps.plan.outputs.repo_pool }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: plan
        run: |
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          scripts/ci-plan.sh "$base" | tee -a "$GITHUB_OUTPUT"

  checks:
    # The fast checks scripts/verify-changed.sh runs on every change.
    needs: plan
    if: needs.plan.outputs.full != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          # The script tests drive the commit hooks, which run pnpm.
          node: ${{ needs.plan.outputs.scripts }}
      - name: Lint and format the changed Python
        run: |
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py')
          if [ "${#files[@]}" -gt 0 ]; then uv run ruff format --check "${files[@]}" && uv run ruff check "${files[@]}"; fi
      - name: Types of the packages
        run: |
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          if git diff --name-only "$base" HEAD | grep -q '^packages/'; then uv run pyright packages; fi
      - run: uv run python scripts/store_inventory.py --check
      - run: uv run python scripts/roles_matrix.py --check
      - run: uv run python deploy/k8s/generate.py --check
      - run: uv run lint-imports --no-logo
      - run: uv run python scripts/check_portable_store.py --strict
      - run: node scripts/changelog-check.mjs --entries
      - name: Script tests
        if: needs.plan.outputs.scripts == 'true'
        run: uv run pytest -q scripts/tests

  service:
    # One job per service; the long suites as test shards beside one job for their lint, types and gates.
    needs: plan
    if: needs.plan.outputs.service_jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.service_jobs) }}
    name: ${{ matrix.service }} ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - if: matrix.service == 'runner-service'
        uses: actions/cache@v4
        with:
          path: .data/runner
          key: runner-wasm-${{ hashFiles('packages/ops_service_kit/src/ops_service_kit/settings.py') }}
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.service == 'agents-service' }}
          # Only the checks run the chat loader in a browser; installing one took most of a test shard's time.
          browser: ${{ matrix.service == 'agents-service' && !startsWith(matrix.part, 'test') }}
          infra: "true"
      - env:
          SERVICE: ${{ matrix.service }}
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            verify|checks) make -C "services/$SERVICE" "$PART" ;;
            test\ *) make -C "services/$SERVICE" test T="$(python3 scripts/test_shard.py "services/$SERVICE/tests" "${PART#test }")" ;;
            *) echo "unknown part $PART"; exit 1 ;;
          esac

  package:
    needs: plan
    if: needs.plan.outputs.full != 'true' && needs.plan.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    name: test ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          infra: "true"
      - run: |
          uv run python scripts/test_db.py "$OPS_TEST_DATABASE_URL"
          cd packages/${{ matrix.package }} && OPS_DATABASE_URL=$OPS_TEST_DATABASE_URL uv run pytest -q

  console:
    needs: plan
    if: needs.plan.outputs.console == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: "false"
          node: "true"
      - run: pnpm verify

  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The workspace's Python: the examples check reads YAML through it (make/docs.mk).
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make -s docs-verify

  repo:
    # A full plan's checks outside the services: the rest of python-verify (its other suites and repo-wide checks),
    # sdk-verify and changelog-verify; with the service, console and docs jobs, everything `make verify` runs.
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The trailer checks read the history of the baseline files.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "true"
          infra: "true"
      - run: make python-verify VERIFY_POOL="${{ needs.plan.outputs.repo_pool }}"
      - run: make sdk-verify changelog-verify

  ci-ok:
    # The one required check: it always runs, waits for every other job, and fails when any of them failed or was
    # cancelled. A job the plan skipped counts as passed, so a narrow change is not held up by suites it did not touch.
    name: ci-ok
    if: always()
    needs: [plan, checks, service, package, console, docs, repo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if grep -qE '"result": "(failure|cancelled)"' <<<"$NEEDS"; then echo "$NEEDS"; exit 1; fi
          echo "every check that ran passed"
