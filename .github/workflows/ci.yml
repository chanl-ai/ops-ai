# Checks on GitHub-hosted runners only, since a fork's pull request runs its own code. A push to develop, a release/* or
# a hotfix/* branch that passes ci-ok is then deployed to staging (job `staging`, which calls deploy-staging.yml).
name: ci

on:
  pull_request:
    # No `labeled`: a label restarts the run, and the concurrency group cancels the one in progress, which leaves its ready and
    # ci-ok failed on the same commit. ci:full counts on the next push; `make gha-verify BRANCH=` runs everything on demand.
    # ready_for_review: a draft runs no job (plan is skipped, and so is everything that needs it); marking it ready starts
    # the run, and later pushes run as usual.
    types: [opened, synchronize, reopened, ready_for_review]
    # A pull request into a release or hotfix branch runs the changed-files plan like one into develop; the push that
    # merges it runs every job. The release's own pull request into main runs release-gate, which reports that push run.
    branches: [develop, main, "release/[0-9]*", "hotfix/**"]
  # The merge queue on develop: the queue's temporary branch (develop plus the queued pull requests) runs the same jobs
  # as a pull request, planned from the queue's base, so ci-ok reports on it and the queue merges only on green.
  merge_group:
    types: [checks_requested]
  # develop and main run the same checks after a merge; the staging job at the end deploys develop, and a release or
  # hotfix branch (docs/deploy/release.md) so the release is tested on staging.
  push:
    branches: [develop, main, "release/[0-9]*", "hotfix/**"]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. A push to develop or main never cancels one: that run may be
# deploying staging, and a deploy stopped halfway leaves the machine between two releases. Its group holds the commit,
# because a group with one slot also drops a queued run when a newer one queues, even with cancel-in-progress off.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The suites reach PostgreSQL, OPA and the mail servers as side containers on localhost.
  OPS_INFRA: external
  OPS_DATABASE_URL: postgresql+asyncpg://ops:ops@localhost:5477/ops_runtime
  OPS_TEST_DATABASE_URL: postgresql+asyncpg://ops:ops@localhost:5477/ops_test
  OPS_OPA_URL: http://127.0.0.1:8181
  OPS_SMTP_HOST: 127.0.0.1
  OPS_GREENMAIL_HOST: 127.0.0.1
  OPS_MAILPIT_HOST: 127.0.0.1
  # What the changed-files plan compares against: the pull request's or merge group's base, or the branch tip before a push. A branch's
  # first push has no tip before it (an all-zero sha), so the whole difference from main is checked. The plan step
  # replaces it for develop and main (below).
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}

jobs:
  plan:
    # The pull request of a release or hotfix branch into main plans nothing: the push to that branch already ran every
    # job on the same commit, and ci-ok below reports that run's result instead of starting a second one.
    # A draft pull request runs nothing; ci-ok below still reports (success), so no required check stays pending.
    if: ${{ github.event.pull_request.draft != true && !(github.base_ref == 'main' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      release: ${{ steps.plan.outputs.release }}
      services: ${{ steps.plan.outputs.services }}
      packages: ${{ steps.plan.outputs.packages }}
      console: ${{ steps.plan.outputs.console }}
      docs: ${{ steps.plan.outputs.docs }}
      scripts: ${{ steps.plan.outputs.scripts }}
      service_jobs: ${{ steps.plan.outputs.service_jobs }}
      repo_pool: ${{ steps.plan.outputs.repo_pool }}
      code: ${{ steps.plan.outputs.code }}
      mssql: ${{ steps.plan.outputs.mssql }}
      heavy: ${{ steps.plan.outputs.heavy }}
      repo_jobs: ${{ steps.plan.outputs.repo_jobs }}
      trivial: ${{ steps.plan.outputs.trivial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: plan
        name: Plan the jobs
        env:
          # [ci full] in the pull request's title, or its ci:full label, runs every job whatever changed.
          CI_FULL: ${{ contains(github.event.pull_request.title, '[ci full]') || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The queue fast-forwards develop to the commit a merge_group run of this workflow tested, so a push to develop of
          # a commit with a green merge_group run plans nothing (ci-ok and staging still run). Anything else pushed to
          # develop, and main, is planned from the last commit whose run passed ci-ok, so a merge whose run was lost or
          # failed is checked with the next one. With no such commit the plan is a full run.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/develop ]; then
            tested=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$GITHUB_SHA&per_page=20" \
              | scripts/ci-tested.sh "$GITHUB_SHA" || echo false)
            if [ "$tested" = true ]; then export CI_TESTED=true; fi
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "${CI_TESTED:-}" != true ] && { [ "$GITHUB_REF" = refs/heads/develop ] || [ "$GITHUB_REF" = refs/heads/main ]; }; then
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=${GITHUB_REF#refs/heads/}&event=push&status=success&per_page=50" \
              | scripts/ci-last-green.sh "$GITHUB_SHA" || true)
            if [ -n "$green" ]; then BASE_SHA=$green; else export CI_FULL=true; fi
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            if [ "$(python3 scripts/ci_trivial.py "$BASE_SHA" HEAD)" = true ]; then export CI_TRIVIAL=true; fi
          fi
          echo "trivial=${CI_TRIVIAL:-false}" >> "$GITHUB_OUTPUT"
          base=$(git merge-base "$BASE_SHA" HEAD)
          scripts/ci-plan.sh "$base" | tee -a "$GITHUB_OUTPUT"

  checks:
    # The one list of checks (make/checks.mk), the same one `make verify`, verify-changed.sh and pre-commit run.
    needs: plan
    # A change of documents only has nothing for these checks; the docs job and the leak scan check it.
    if: (needs.plan.outputs.full != 'true' && needs.plan.outputs.code == 'true') || needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    # make checks takes about 6 minutes and, when scripts/ changed, the script tests about 8 more (2026-11-22: 6m + 7m41s
    # was cancelled at 15).
    timeout-minutes: 25
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          # The SDK drift check, the changelog check and the console's standards run on node; the script tests drive
          # the commit hooks, which run pnpm.
          node: "true"
          # The script tests start tools-service (scripts/tests/test_page_stack.py), which loads its review key into
          # OPA at start and exits when none answers; with OPS_INFRA=external that is the side container infra starts.
          infra: ${{ needs.plan.outputs.scripts }}
      - name: Lint and format the changed Python
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py')
          if [ "${#files[@]}" -gt 0 ]; then uv run ruff format --check "${files[@]}" && uv run ruff check "${files[@]}"; fi
      - name: Types of the packages
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          if git diff --name-only "$base" HEAD | grep -q '^packages/'; then uv run python scripts/check_tests_typecheck.py packages; fi
      - run: make -s checks
      - name: Script tests
        # The slowest check here; it runs whenever scripts/ or a workflow changed, so a pull request sees what the queue will.
        if: needs.plan.outputs.scripts == 'true'
        run: uv run pytest -q -n auto --dist loadfile scripts/tests

  service:
    # One job per service; the long suites as test shards beside one job for their lint, types and gates. The services
    # whose verify is short share one job (scripts/ci-plan.sh): the service field then lists them, and each runs in its
    # own log group with a PASS or FAIL line, so the failed one is named.
    needs: plan
    if: needs.plan.outputs.service_jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.service_jobs) }}
    name: ${{ matrix.service }} ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: contains(matrix.service, 'runner-service')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .data/runner
          key: runner-wasm-${{ hashFiles('packages/ops_service_kit/src/ops_service_kit/settings.py') }}
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.service == 'agents-service' }}
          # Only the checks run the chat loader in a browser; installing one took most of a test shard's time.
          browser: ${{ matrix.service == 'agents-service' && !startsWith(matrix.part, 'test') }}
          infra: "true"
      - env:
          SERVICE: ${{ matrix.service }}
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            verify)
              failed=""
              for svc in $SERVICE; do
                echo "::group::$svc verify"
                if make -C "services/$svc" verify; then echo "PASS $svc"; else echo "FAIL $svc"; failed="$failed $svc"; fi
                echo "::endgroup::"
              done
              if [ -n "$failed" ]; then echo "::error title=verify failed::$failed"; exit 1; fi ;;
            checks) make -C "services/$SERVICE" checks ;;
            test\ *) make -C "services/$SERVICE" test T="$(python3 scripts/test_shard.py "services/$SERVICE/tests" "${PART#test }")" ;;
            *) echo "unknown part $PART"; exit 1 ;;
          esac

  package:
    # Every changed package's suite in one job, one after the other: a suite takes 15 to 30 seconds and the checkout, setup
    # and database container of a job of its own took 45 (measured 2026-11), so nine jobs became one. Each suite gets a
    # fresh test database, runs to the end whatever the one before did, and the job names every package that failed.
    needs: plan
    if: needs.plan.outputs.full != 'true' && needs.plan.outputs.packages != '[]'
    name: test packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          infra: "true"
      - env:
          PACKAGES: ${{ join(fromJSON(needs.plan.outputs.packages), ' ') }}
        run: |
          failed=""
          for pkg in $PACKAGES; do
            echo "::group::test $pkg"
            if (uv run python scripts/test_db.py "$OPS_TEST_DATABASE_URL" && cd "packages/$pkg" && OPS_DATABASE_URL=$OPS_TEST_DATABASE_URL uv run pytest -q); then echo "PASS $pkg"; else echo "FAIL $pkg"; failed="$failed $pkg"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error title=package tests failed::$failed"; exit 1; fi

  console:
    needs: plan
    if: needs.plan.outputs.console == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python: "false"
          node: "true"
      - run: pnpm verify

  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace's Python: the examples check reads YAML through it (make/docs.mk).
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: make -s docs-verify

  repo:
    # A full plan's checks outside the services: the rest of python-verify (its other suites and repo-wide checks),
    # sdk-verify and changelog-verify; with the service, console and docs jobs, everything `make verify` runs. One job
    # per entry of the plan's repo_jobs (a suite, the check list, the script tests, the SDK checks) side by side: in one
    # job they took 31 minutes. Not on a pull request: the merge queue and develop pushes run it (heavy).
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.repo_jobs) }}
    name: repo ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The trailer checks read the history of the baseline files.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.part == 'checks' || matrix.part == 'sdk' || matrix.part == 'scripts' }}
          infra: "true"
      - env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            pool-*) make python-pool VERIFY_POOL="$PART" ;;
            checks) make -k python-lint python-checks ;;
            scripts) make python-scripts ;;
            sdk) make sdk-verify changelog-verify ;;
            *) echo "unknown part $PART"; exit 1 ;;
          esac

  store-mssql:
    # The store, kit and identity suites on SQL Server beside PostgreSQL: the tests that run on both databases skip
    # SQL Server unless OPS_MSSQL_SERVER and MSSQL_SA_PASSWORD are set (packages/ops_store/CLAUDE.md), so a run that
    # skips any of them fails here. The image is the pinned one deploy/fly/mssql/Dockerfile builds on.
    # Never on a pull request (heavy is false there, a store change included) unless it carries ci:full: the merge queue
    # and develop pushes run it whenever the plan says mssql, and a release or hotfix branch runs it with its full plan,
    # so a SQL Server failure first shows in the queue.
    needs: plan
    if: needs.plan.outputs.mssql == 'true' && needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          infra: "true"
      - name: SQL Server
        run: |
          # A password made for this run, masked before it is used; it never reaches a file or the log.
          pw=$(python3 -c 'import secrets,string;p=[secrets.choice(s) for s in (string.ascii_uppercase,string.ascii_lowercase,string.digits) for _ in range(8)];secrets.SystemRandom().shuffle(p);print("".join(p))')
          echo "::add-mask::$pw"
          echo "MSSQL_SA_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "OPS_MSSQL_SERVER=127.0.0.1,1433" >> "$GITHUB_ENV"
          docker run -d --name ops-mssql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2025-latest@sha256:21cba63f9e5f93ae72d211e50bceca8f047a6233da18ed5ecb497152f97eca7b
          scripts/install-sql-server-driver.sh
          odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server" || { odbcinst -q -d; echo "::error::ODBC Driver 18 is not registered"; exit 1; }
          for _ in $(seq 60); do docker logs ops-mssql 2>&1 | grep -q "ready for client" && break; sleep 2; done
          docker logs ops-mssql 2>&1 | grep -q "ready for client" || { docker logs ops-mssql | tail -20; exit 1; }
      - name: The both-database suites
        shell: bash
        run: |
          uv run python scripts/test_db.py "$OPS_TEST_DATABASE_URL"
          for p in ops_store ops_service_kit ops_identity; do
            (cd "packages/$p" && OPS_DATABASE_URL=$OPS_TEST_DATABASE_URL uv run pytest -q -rs -p no:cacheprovider) | tee -a "$RUNNER_TEMP/mssql-suites.log"
          done
          # A pass that skipped SQL Server tested one database only.
          if grep -E "SKIPPED.*(OPS_MSSQL_SERVER|SQL Server)" "$RUNNER_TEMP/mssql-suites.log"; then
            echo "::error title=SQL Server not tested::A both-database test skipped SQL Server (above)."; exit 1
          fi
      - name: The services' store tests on both databases
        shell: bash
        run: |
          # Each service's database_url runs on PostgreSQL and on a scratch SQL Server database holding its golden DDL
          # (ops_store.testing.sql_server_schema). The files that exercise stores, isolation and migrations only; the
          # provider, storage and route tests stay in the service job, on PostgreSQL.
          declare -A files=(
            [agents-service]="tests/store/test_registry_policies.py tests/store/test_registry_policies_migration.py tests/store/test_registry_tenant_migration.py tests/store/test_registry_tenant_keys_migration.py tests/store/test_skill_list.py tests/store/test_threads_list.py tests/store/test_skill_step_tools_migration.py tests/store/test_stale_saves.py tests/store/test_schedule_teams_migration.py tests/store/test_workflow_schedules.py"
            [models-service]="tests/test_call_log_isolation_migration.py tests/test_call_log_rows_isolated.py tests/test_model_key_share_rows_isolated.py tests/test_provider_key_rows_isolated.py tests/test_alias_current_index.py tests/test_spend_caps.py tests/test_key_spend_race.py tests/test_spend_retention.py"
            [documents-service]="tests/test_isolation.py tests/test_template_copies.py"
            [files-service]="tests/test_isolation.py tests/test_store.py"
            [kb-service]="tests/test_kb_isolation.py tests/test_kb_changed.py tests/test_team_isolation.py tests/test_background_tenants.py tests/test_system_user_predicates.py tests/test_lookup_indexes.py tests/test_list_routes.py tests/test_statement_budget.py"
            [platform-service]="tests/test_store_both_databases.py tests/test_lookup_exposure.py tests/test_migrations.py tests/test_rls.py tests/test_policies.py tests/test_access_check.py tests/test_acting_for.py tests/test_api_key_target.py tests/test_audit_events.py tests/test_bootstrap.py tests/test_boundary.py tests/test_cors.py tests/test_custom_roles.py tests/test_dev_sign_in.py tests/test_flags.py tests/test_identity_seam.py tests/test_introspect.py tests/test_member_options.py tests/test_reply_pins.py tests/test_saml_security.py tests/test_seed.py tests/test_team_names.py tests/test_tenancy_mode.py tests/test_workspace_admin.py tests/test_body_name_pins.py tests/test_signin_lockout.py tests/test_signin_password.py tests/test_auth.py tests/test_holders.py tests/test_signin_secrets.py tests/test_api_keys.py tests/test_step_up.py tests/test_role_assignments.py"
            [tools-service]="tests/test_policed_tables.py tests/test_module_tenant_policy.py tests/test_mcp_link_rows_isolated.py tests/test_secret_rows_isolated.py tests/test_sign_in_rows_isolated.py tests/test_registry_store.py tests/test_background_two_tenants.py tests/test_gateway_fences.py tests/test_statement_budget.py"
          )
          failed=0
          printf '| service | PostgreSQL passed | SQL Server passed | result |\n|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          for s in agents-service models-service documents-service files-service kb-service tools-service platform-service; do
            log="$RUNNER_TEMP/mssql-$s.log"
            read -ra picked <<<"${files[$s]}"
            (cd "services/$s" && OPS_DATABASE_URL=$OPS_TEST_DATABASE_URL uv run pytest -vv -rs -p no:cacheprovider "${picked[@]}") > "$log" 2>&1 || failed=1
            grep -E " (FAILED|ERROR)|^(FAILED|ERROR|SKIPPED)|^E  " "$log" | head -60 || true
            pg=$(grep " PASSED" "$log" | grep -c "postgresql" || true)
            ms=$(grep " PASSED" "$log" | grep -c "mssql" || true)
            result=$(tail -1 "$log")
            echo "$s: PostgreSQL passed $pg, SQL Server passed $ms; $result"
            echo "| $s | $pg | $ms | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$ms" -eq 0 ] || grep -qE "SKIPPED.*(OPS_MSSQL_SERVER|SQL Server)" "$log"; then
              echo "::error title=SQL Server not tested::$s passed no SQL Server case, or skipped one."; failed=1
            fi
          done
          exit $failed

  release-proof:
    # A release or hotfix branch: its version file matches its name, the upgrade from the offline floor and from the
    # latest release on a seeded database, and a fresh install through ./install.sh, on every push to it. The pull
    # request into main is not mergeable unless this job succeeded on its head (ci-ok reads the push run). Both come before the vX.Y.Z tag publishes the images, so the install pulls images built from this commit from
    # a registry inside the runner (BUILD=1); the pull from ghcr.io is a check after the tag
    # (docs/deploy/release.md). Needs the whole history and its tags.
    needs: plan
    # A pull request skips it (heavy); the push to the release or hotfix branch runs it, and a ci:full label asks for it.
    if: needs.plan.outputs.heavy == 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'main') || needs.plan.outputs.release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
        with:
          node: "true"
          # The install proof walks every console page headless (deploy/release/install_proof.sh step 4).
          browser: "true"
      - name: The version file matches the branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/release.py check-version
      - name: The upgrade from the offline floor
        # The oldest supported install (docs/deploy/database.md), reported apart from the upgrade most installs make.
        run: make db-scripts-proof FROM="$(sed -n 's/^FLOOR=//p' deploy/database/proof.sh)"
      - name: The upgrade from the latest release
        # The newest vX.Y.Z tag reachable from main (scripts/release.py latest; rc tags and date tags are not releases).
        run: |
          last=$(python3 scripts/release.py latest)
          floor=$(sed -n 's/^FLOOR=//p' deploy/database/proof.sh)
          if git merge-base --is-ancestor "$last" "$floor"; then echo "$last is not after $floor, which the step above proved"; exit 0; fi
          echo "upgrade from $last"
          make db-scripts-proof FROM="$last"
      - name: A fresh install
        run: make install-proof BUILD=1

  maintainer-review:
    # A raised or new baseline row, or a new access exception line, in this pull request's commits needs an approving
    # review on the pull request from a maintainer listed in .github/standards-maintainers.txt (scripts/baseline_history.py).
    # The review is read from GitHub, so no commit message can stand in for it. After the review is given, re-run this job.
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: The base revision's copies of the gate
        # The scripts, the make list and the ratchet tests below decide whether a rise passes, and this pull request
        # may have edited them to say it does. They are replaced here by the base's own files, so what judges the pull
        # request is what was already merged. An edit to any of them is itself a rise (scripts/baseline_history.py
        # PROTECTED), and this workflow file is the root of that trust: protect it with a code owner rule on .github/.
        # The pull request that adds the gate has no base copy: its own run, with a warning, and the owner's review by hand.
        env:
          TRUSTED: >-
            scripts/check_review_approval.py scripts/baseline_history.py scripts/check_access_exceptions.py
            scripts/check_portable_store.py scripts/check_config_literals.py scripts/check_typed_boundaries.py
            scripts/check_console_baselines.py
            scripts/keep_going.sh make/checks.mk Makefile
            packages/ops_store/tests/test_isolation_sites.py packages/ops_store/tests/test_relay_sites.py
            packages/ops_store/tests/test_loop_health.py deploy/database/tests/test_indexes.py
        run: |
          if ! git cat-file -e "$BASE_SHA:scripts/check_review_approval.py" 2>/dev/null; then
            echo "::warning title=Gate added here::The base has no maintainer-review gate, so this pull request's own copies run; its review is the owner's, by hand."
            exit 0
          fi
          for f in $TRUSTED; do
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then git show "$BASE_SHA:$f" > "$f"; fi
          done
          echo "gate files taken from $BASE_SHA"
      - name: A rise needs a maintainer's approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          review=$(uv run python scripts/check_review_approval.py --repo "$GITHUB_REPOSITORY" --pr "$PR" --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "maintainer review: $review"
          OPS_STANDARDS_BASE=$(git merge-base "$BASE_SHA" HEAD) OPS_STANDARDS_REVIEW="$review" make -s checks-history

  usecases:
    # Only the use cases the changed files affect (scripts/agents/usecase_map.json, the map `make usecase-pick` prints),
    # on a pull request and on the merge queue's group alike, so a use case is never run on the owner's Mac. A failure
    # config/quarantine.json covers is printed and does not fail the job; the nightly runs every use case
    # (nightly-usecases.yml). A diff that affects more than ci_usecases.MAX_PICK use cases runs none here and prints why.
    needs: plan
    if: needs.plan.outputs.code == 'true'
    # Warn-only from 2026-11-27 (owner decision). Back to blocking after 3 develop runs in a row pass the use case job
    # with nothing quarantined except the documented nightly 621; the same PR reverts this. A job-level
    # continue-on-error leaves the job's own check red when a use case fails, and reports its result to `ready` and
    # `ci-ok` (through `needs`) as success, so a failure shows on the run without holding the queue.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick the use cases
        id: pick
        shell: bash
        run: |
          set -o pipefail
          base=$(git merge-base "$BASE_SHA" HEAD)
          ids=$(python3 scripts/ci_usecases.py pick --base "$base" | tr '\n' ' ' | xargs)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "use cases: ${ids:-none}"
      - if: steps.pick.outputs.ids != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .data/runner
          key: runner-wasm-${{ hashFiles('packages/ops_service_kit/src/ops_service_kit/settings.py') }}
      - if: steps.pick.outputs.ids != ''
        uses: ./.github/actions/setup
        with:
          node: "true"
          browser: "true"
          infra: "true"
      - if: steps.pick.outputs.ids != ''
        name: Run them on the scripted model
        env:
          IDS: ${{ steps.pick.outputs.ids }}
        run: |
          scripts/ensure-sdk-ts-built.sh
          # shellcheck disable=SC2086
          python3 scripts/ci_usecases.py run --out "$RUNNER_TEMP/usecases.json" $IDS
      - if: always() && steps.pick.outputs.ids != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usecase-logs
          path: |
            .logs/usecases
            ${{ runner.temp }}/usecases.json
          if-no-files-found: ignore
          retention-days: 7

  generated:
    # The committed OpenAPI documents and the SDKs' generated layer are rebuilt from the pull request's code with the
    # target a person would run (`make openapi`). A difference is handed to generated-commit as a patch, so nobody
    # commits generated files by hand and two pull requests do not conflict in them. This job holds no secret and no
    # write access, because it runs the pull request's code. Not for a fork (its branch cannot be pushed to) and never
    # in the merge queue, where the repo job's sdk-verify fails a document that drifted.
    needs: plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.regen.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: touched
        name: Did a route, a model or the SDK generator change
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          if git diff --name-only "$base" HEAD | grep -qE '^(services|packages|sdk)/'; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.touched.outputs.run == 'true'
        uses: ./.github/actions/setup
        with:
          node: "true"
      - id: regen
        if: steps.touched.outputs.run == 'true'
        name: Regenerate the OpenAPI documents and the SDKs
        run: |
          make -s openapi
          git add -A -- 'services/*/openapi.json' sdk
          git diff --cached --binary > "$RUNNER_TEMP/generated.patch"
          if [ -s "$RUNNER_TEMP/generated.patch" ]; then
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "the committed documents and SDKs match the code"
          fi
      - if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-patch
          path: ${{ runner.temp }}/generated.patch
          retention-days: 1

  generated-commit:
    # Commits the patch to the pull request's branch. It runs none of the pull request's code: it applies the patch and
    # pushes over the deploy key, so the commit starts its own checks (.github/actions/push-key).
    needs: generated
    if: github.event_name == 'pull_request' && needs.generated.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-patch
          path: ${{ runner.temp }}/patch
      - uses: ./.github/actions/push-key
        with:
          key: ${{ secrets.RELEASE_MAIN_DEPLOY_KEY }}
      - name: Commit the generated files to the branch
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then echo "the branch moved on; its newer run regenerates"; exit 0; fi
          git apply --index "$RUNNER_TEMP/patch/generated.patch"
          git commit -q -m "chore(sdk): regenerate the OpenAPI documents and the SDKs"
          git push -q "$PUSH_URL" "HEAD:refs/heads/$HEAD_REF"

  ready:
    # Whether the merge queue may take this: every other job passed and CodeQL is green on the pull request's head; in the
    # queue's own run also that each pull request of the group was labelled `reviewed` by a maintainer after its last push. The
    # queue tests the pull request on develop's tip, so a stale base does not matter. A queue group and
    # a push are built on develop, and CodeQL reports on pull requests, so there only the jobs are judged.
    # scripts/pr_flow.py ready; its --self-test is in make checks.
    name: ready
    if: always() && github.event.pull_request.draft != true && !(github.base_ref == 'main' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')))
    needs: [plan, checks, service, package, console, docs, repo, store-mssql, release-proof, usecases, maintainer-review]
    runs-on: ubuntu-24.04
    # CodeQL may still be running when the last job ends; this waits for it (codeql.yml allows it 45 minutes).
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ready for the queue
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # A pull request that changes no file runs no CodeQL; only then does ready not wait for it.
          TRIVIAL: ${{ needs.plan.outputs.trivial }}
          # In the merge queue, every pull request of the group must carry a valid `reviewed` label (pr_flow.py review_problems).
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 scripts/pr_flow.py ready

  ci-ok:
    # The one required check: it always runs, waits for every other job, and fails when any of them failed or was
    # cancelled. A job the plan skipped counts as passed, so a narrow change is not held up by suites it did not touch;
    # a draft pull request skips the plan and so every job, and this reports success without waiting for any.
    # `ready` is one of them, so the queue requires it without a second required check.
    name: ci-ok
    if: always()
    needs: [plan, checks, service, package, console, docs, repo, store-mssql, release-proof, usecases, maintainer-review, generated, generated-commit, ready]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if grep -qE '"result": "(failure|cancelled)"' <<<"$NEEDS"; then echo "$NEEDS"; exit 1; fi
          if [ "$DRAFT" = true ]; then echo "draft pull request: no job ran; the checks start when it is marked ready"; exit 0; fi
          echo "every check that ran passed"

  release-gate:
    # The release or hotfix pull request into main reports the push run of its commit: that run holds every job, the
    # release-proof (the upgrade from the newest release, 90 minutes at most) and the staging deploy with its click walk.
    # It has its own name because the push run's ci-ok sits on the same commit; branch protection requires this one on main.
    # Red, cancelled, skipped, missing or timed out all fail it. The wait is 150 minutes and the job allows 170, so the last
    # error line always prints.
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the push run of this commit and read its release-proof and staging deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 300); do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$SHA&per_page=1" --jq '.workflow_runs[0] | "\(.id) \(.status) \(.conclusion)"' 2>/dev/null || true)
            id=${found%% *}; run=${found#* }
            case "$run" in
              "completed success")
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" | python3 scripts/release.py proof && exit 0
                echo "::error title=Release not proven::the push run of $SHA has no passing release-proof and staging deploy"; exit 1 ;;
              "completed "*) echo "::error title=Candidate not green::the push run of $SHA ended: $run"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error title=Candidate not tested::no finished push run of $SHA after 150 minutes; push the branch or re-run this job"; exit 1

  staging:
    # Every merge to develop, and every push to a release or hotfix branch, goes to staging once ci-ok passed for that
    # commit, so the owner tests the real combination. Pull requests and pushes to main never reach this job.
    # deploy-staging.yml holds the deploy, the freeze rules (a release or hotfix branch on origin, or STAGING_HOLD, skips
    # a develop deploy and skips the deploy with a notice), the checks, the rollback and the summary.
    needs: ci-ok
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')) && needs.ci-ok.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-staging.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  staging-scan:
    # A release or hotfix branch's web scan: an OWASP ZAP baseline of staging after that branch's own deploy, so it reads
    # the release under test (release-security.yml holds the branch's other scans, which need no deploy). Passive rules
    # only: it spiders for a minute and sends no attack. Report only for now: baseline rules warn, and -I keeps a
    # warning from failing the job; the report is the artifact zap-baseline.
    needs: [plan, ci-ok, staging]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.staging.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORIGIN: https://${{ vars.STG_APP }}.fly.dev
      # By digest, so a moved tag cannot change what runs here.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
    steps:
      - name: ZAP baseline scan of staging
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" zap-baseline.py -t "$ORIGIN" -m 1 -I -r zap.html -J zap.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline
          path: zap/
          if-no-files-found: ignore
          retention-days: 14
