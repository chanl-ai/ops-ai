# Checks on GitHub-hosted runners only, since a fork's pull request runs its own code. A push to develop, a release/* or
# a hotfix/* branch that passes ci-ok is then deployed to staging (job `staging`, which calls deploy-staging.yml).
name: ci

on:
  pull_request:
    # labeled: adding ci:full starts a run of every job without a new push.
    types: [opened, synchronize, reopened, labeled]
    # A pull request into a release branch runs nothing: the release's own pull request to develop runs CI once
    # (docs/deploy/release.md).
    branches: [develop, main]
  # The merge queue on develop: the queue's temporary branch (develop plus the queued pull requests) runs the same jobs
  # as a pull request, planned from the queue's base, so ci-ok reports on it and the queue merges only on green.
  merge_group:
    types: [checks_requested]
  # develop and main run the same checks after a merge; the staging job at the end deploys develop, and a release or
  # hotfix branch (docs/deploy/release.md) so the release is tested on staging.
  push:
    branches: [develop, main, "hotfix/**"]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. A push to develop or main never cancels one: that run may be
# deploying staging, and a deploy stopped halfway leaves the machine between two releases. Its group holds the commit,
# because a group with one slot also drops a queued run when a newer one queues, even with cancel-in-progress off.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The suites reach PostgreSQL, OPA and the mail servers as side containers on localhost.
  OPS_INFRA: external
  OPS_DATABASE_URL: postgresql+asyncpg://ops:ops@localhost:5477/ops_runtime
  OPS_TEST_DATABASE_URL: postgresql+asyncpg://ops:ops@localhost:5477/ops_test
  OPS_OPA_URL: http://127.0.0.1:8181
  OPS_SMTP_HOST: 127.0.0.1
  OPS_GREENMAIL_HOST: 127.0.0.1
  OPS_MAILPIT_HOST: 127.0.0.1
  # What the changed-files plan compares against: the pull request's or merge group's base, or the branch tip before a push. A branch's
  # first push has no tip before it (an all-zero sha), so the whole difference from main is checked. The plan step
  # replaces it for develop and main (below).
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      release: ${{ steps.plan.outputs.release }}
      services: ${{ steps.plan.outputs.services }}
      packages: ${{ steps.plan.outputs.packages }}
      console: ${{ steps.plan.outputs.console }}
      docs: ${{ steps.plan.outputs.docs }}
      scripts: ${{ steps.plan.outputs.scripts }}
      service_jobs: ${{ steps.plan.outputs.service_jobs }}
      repo_pool: ${{ steps.plan.outputs.repo_pool }}
      code: ${{ steps.plan.outputs.code }}
      mssql: ${{ steps.plan.outputs.mssql }}
      heavy: ${{ steps.plan.outputs.heavy }}
      repo_jobs: ${{ steps.plan.outputs.repo_jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: plan
        name: Plan the jobs
        env:
          # [ci full] in the pull request's title, or its ci:full label, runs every job whatever changed.
          CI_FULL: ${{ contains(github.event.pull_request.title, '[ci full]') || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push to develop or main is planned from the last commit whose run passed ci-ok, so a merge whose run was
          # lost or failed is checked with the next one. With no such commit the plan is a full run.
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ "$GITHUB_REF" = refs/heads/develop ] || [ "$GITHUB_REF" = refs/heads/main ]; }; then
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=${GITHUB_REF#refs/heads/}&event=push&status=success&per_page=50" \
              | scripts/ci-last-green.sh "$GITHUB_SHA" || true)
            if [ -n "$green" ]; then BASE_SHA=$green; else export CI_FULL=true; fi
          fi
          base=$(git merge-base "$BASE_SHA" HEAD)
          scripts/ci-plan.sh "$base" | tee -a "$GITHUB_OUTPUT"

  checks:
    # The one list of checks (make/checks.mk), the same one `make verify`, verify-changed.sh and pre-commit run.
    needs: plan
    # A change of documents only has nothing for these checks; the docs job and the leak scan check it.
    if: (needs.plan.outputs.full != 'true' && needs.plan.outputs.code == 'true') || needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    # make checks takes about 6 minutes and, when scripts/ changed, the script tests about 8 more (2026-11-22: 6m + 7m41s
    # was cancelled at 15).
    timeout-minutes: 25
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          # The SDK drift check, the changelog check and the console's standards run on node; the script tests drive
          # the commit hooks, which run pnpm.
          node: "true"
          # The script tests start tools-service (scripts/tests/test_page_stack.py), which loads its review key into
          # OPA at start and exits when none answers; with OPS_INFRA=external that is the side container infra starts.
          infra: ${{ needs.plan.outputs.scripts }}
      - name: Lint and format the changed Python
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py')
          if [ "${#files[@]}" -gt 0 ]; then uv run ruff format --check "${files[@]}" && uv run ruff check "${files[@]}"; fi
      - name: Types of the packages
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          if git diff --name-only "$base" HEAD | grep -q '^packages/'; then uv run python scripts/check_tests_typecheck.py packages; fi
      - run: make -s checks
      - name: Script tests
        # The slowest check here; a pull request leaves it to the merge queue (heavy is false on a pull request).
        if: needs.plan.outputs.scripts == 'true' && needs.plan.outputs.heavy == 'true'
        run: uv run pytest -q -n auto --dist loadfile scripts/tests

  service:
    # One job per service; the long suites as test shards beside one job for their lint, types and gates.
    needs: plan
    if: needs.plan.outputs.service_jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.service_jobs) }}
    name: ${{ matrix.service }} ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.service == 'runner-service'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .data/runner
          key: runner-wasm-${{ hashFiles('packages/ops_service_kit/src/ops_service_kit/settings.py') }}
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.service == 'agents-service' }}
          # Only the checks run the chat loader in a browser; installing one took most of a test shard's time.
          browser: ${{ matrix.service == 'agents-service' && !startsWith(matrix.part, 'test') }}
          infra: "true"
      - env:
          SERVICE: ${{ matrix.service }}
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            verify|checks) make -C "services/$SERVICE" "$PART" ;;
            test\ *) make -C "services/$SERVICE" test T="$(python3 scripts/test_shard.py "services/$SERVICE/tests" "${PART#test }")" ;;
            *) echo "unknown part $PART"; exit 1 ;;
          esac

  package:
    needs: plan
    if: needs.plan.outputs.full != 'true' && needs.plan.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    name: test ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          infra: "true"
      - run: |
          uv run python scripts/test_db.py "$OPS_TEST_DATABASE_URL"
          cd packages/${{ matrix.package }} && OPS_DATABASE_URL=$OPS_TEST_DATABASE_URL uv run pytest -q

  console:
    needs: plan
    if: needs.plan.outputs.console == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python: "false"
          node: "true"
      - run: pnpm verify

  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace's Python: the examples check reads YAML through it (make/docs.mk).
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: make -s docs-verify

  repo:
    # A full plan's checks outside the services: the rest of python-verify (its other suites and repo-wide checks),
    # sdk-verify and changelog-verify; with the service, console and docs jobs, everything `make verify` runs. One job
    # per entry of the plan's repo_jobs (a suite, the check list, the script tests, the SDK checks) side by side: in one
    # job they took 31 minutes. Not on a pull request: the merge queue and develop pushes run it (heavy).
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.repo_jobs) }}
    name: repo ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The trailer checks read the history of the baseline files.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.part == 'checks' || matrix.part == 'sdk' || matrix.part == 'scripts' }}
          infra: "true"
      - env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            pool-*) make python-pool VERIFY_POOL="$PART" ;;
            checks) make -k python-lint python-checks ;;
            scripts) make python-scripts ;;
            sdk) make sdk-verify changelog-verify ;;
            *) echo "unknown part $PART"; exit 1 ;;
          esac

  store-mssql:
    # The store, kit and identity suites on SQL Server beside PostgreSQL: the tests that run on both databases skip
    # SQL Server unless OPS_MSSQL_SERVER and MSSQL_SA_PASSWORD are set (packages/ops_store/CLAUDE.md), so a run that
    # skips any of them fails here. The image is the pinned one deploy/fly/mssql/Dockerfile builds on.
    # Not on a pull request: the merge queue and develop pushes run it (heavy).
    needs: plan
    if: needs.plan.outputs.mssql == 'true' && needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 17 with pgvector, which knowledge search by meaning needs (kb_0021).
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          infra: "true"
      - name: SQL Server
        run: |
          # A password made for this run, masked before it is used; it never reaches a file or the log.
          pw=$(python3 -c 'import secrets,string;p=[secrets.choice(s) for s in (string.ascii_uppercase,string.ascii_lowercase,string.digits) for _ in range(8)];secrets.SystemRandom().shuffle(p);print("".join(p))')
          echo "::add-mask::$pw"
          echo "MSSQL_SA_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "OPS_MSSQL_SERVER=127.0.0.1,1433" >> "$GITHUB_ENV"
          docker run -d --name ops-mssql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2025-latest@sha256:21cba63f9e5f93ae72d211e50bceca8f047a6233da18ed5ecb497152f97eca7b
          scripts/install-sql-server-driver.sh
          odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server" || { odbcinst -q -d; echo "::error::ODBC Driver 18 is not registered"; exit 1; }
          for _ in $(seq 60); do docker logs ops-mssql 2>&1 | grep -q "ready for client" && break; sleep 2; done
          docker logs ops-mssql 2>&1 | grep -q "ready for client" || { docker logs ops-mssql | tail -20; exit 1; }
      - name: The both-database suites
        shell: bash
        run: |
          uv run python scripts/test_db.py "$OPS_TEST_DATABASE_URL"
          for p in ops_store ops_service_kit ops_identity; do
            (cd "packages/$p" && OPS_DATABASE_URL=$OPS_TEST_DATABASE_URL uv run pytest -q -rs -p no:cacheprovider) | tee -a "$RUNNER_TEMP/mssql-suites.log"
          done
          # A pass that skipped SQL Server tested one database only.
          if grep -E "SKIPPED.*(OPS_MSSQL_SERVER|SQL Server)" "$RUNNER_TEMP/mssql-suites.log"; then
            echo "::error title=SQL Server not tested::A both-database test skipped SQL Server (above)."; exit 1
          fi
      - name: The services' store tests on both databases
        shell: bash
        run: |
          # Each service's database_url runs on PostgreSQL and on a scratch SQL Server database holding its golden DDL
          # (ops_store.testing.sql_server_schema). The files that exercise stores, isolation and migrations only; the
          # provider, storage and route tests stay in the service job, on PostgreSQL.
          declare -A files=(
            [agents-service]="tests/store/test_registry_policies.py tests/store/test_registry_policies_migration.py tests/store/test_registry_tenant_migration.py tests/store/test_registry_tenant_keys_migration.py tests/store/test_skill_list.py tests/store/test_threads_list.py tests/store/test_skill_step_tools_migration.py tests/store/test_stale_saves.py"
            [models-service]="tests/test_call_log_isolation_migration.py tests/test_call_log_rows_isolated.py tests/test_model_key_share_rows_isolated.py tests/test_provider_key_rows_isolated.py tests/test_alias_current_index.py tests/test_spend_caps.py tests/test_key_spend_race.py tests/test_spend_retention.py"
            [documents-service]="tests/test_isolation.py tests/test_template_copies.py"
            [files-service]="tests/test_isolation.py tests/test_store.py"
            [kb-service]="tests/test_kb_isolation.py tests/test_kb_changed.py tests/test_team_isolation.py tests/test_background_tenants.py tests/test_system_user_predicates.py tests/test_lookup_indexes.py tests/test_list_routes.py tests/test_statement_budget.py"
            [platform-service]="tests/test_store_both_databases.py tests/test_lookup_exposure.py tests/test_migrations.py tests/test_rls.py tests/test_policies.py tests/test_access_check.py tests/test_acting_for.py tests/test_api_key_target.py tests/test_audit_events.py tests/test_bootstrap.py tests/test_boundary.py tests/test_cors.py tests/test_custom_roles.py tests/test_dev_sign_in.py tests/test_flags.py tests/test_identity_seam.py tests/test_introspect.py tests/test_member_options.py tests/test_reply_pins.py tests/test_saml_security.py tests/test_seed.py tests/test_team_names.py tests/test_tenancy_mode.py tests/test_workspace_admin.py tests/test_body_name_pins.py tests/test_signin_lockout.py tests/test_signin_password.py tests/test_auth.py tests/test_holders.py tests/test_signin_secrets.py tests/test_api_keys.py tests/test_step_up.py tests/test_role_assignments.py"
            [tools-service]="tests/test_policed_tables.py tests/test_module_tenant_policy.py tests/test_mcp_link_rows_isolated.py tests/test_secret_rows_isolated.py tests/test_sign_in_rows_isolated.py tests/test_registry_store.py tests/test_background_two_tenants.py tests/test_gateway_fences.py tests/test_statement_budget.py"
          )
          failed=0
          printf '| service | PostgreSQL passed | SQL Server passed | result |\n|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          for s in agents-service models-service documents-service files-service kb-service tools-service platform-service; do
            log="$RUNNER_TEMP/mssql-$s.log"
            read -ra picked <<<"${files[$s]}"
            (cd "services/$s" && OPS_DATABASE_URL=$OPS_TEST_DATABASE_URL uv run pytest -vv -rs -p no:cacheprovider "${picked[@]}") > "$log" 2>&1 || failed=1
            grep -E " (FAILED|ERROR)|^(FAILED|ERROR|SKIPPED)|^E  " "$log" | head -60 || true
            pg=$(grep " PASSED" "$log" | grep -c "postgresql" || true)
            ms=$(grep " PASSED" "$log" | grep -c "mssql" || true)
            result=$(tail -1 "$log")
            echo "$s: PostgreSQL passed $pg, SQL Server passed $ms; $result"
            echo "| $s | $pg | $ms | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$ms" -eq 0 ] || grep -qE "SKIPPED.*(OPS_MSSQL_SERVER|SQL Server)" "$log"; then
              echo "::error title=SQL Server not tested::$s passed no SQL Server case, or skipped one."; failed=1
            fi
          done
          exit $failed

  release-proof:
    # A pull request into main is a release: the branch's version file matches its name, the upgrade from the last tag's
    # schema on a seeded database, and a fresh install through ./install.sh. A push to a release or hotfix branch runs it
    # too. Both come before the vX.Y.Z tag publishes the images, so the install pulls images built from this commit from
    # a registry inside the runner (BUILD=1); the pull from ghcr.io is a check after the tag
    # (docs/deploy/release.md). Needs the whole history and its tags.
    needs: plan
    # A pull request skips it (heavy); the push to the release or hotfix branch runs it, and a ci:full label asks for it.
    if: needs.plan.outputs.heavy == 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'main') || needs.plan.outputs.release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
        with:
          node: "true"
          # The install proof walks every console page headless (deploy/release/install_proof.sh step 4).
          browser: "true"
      - name: The version file matches the branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/release.py check-version
      - name: The upgrade from the last release
        run: |
          last=$(git tag --list 'v20*' --sort=-v:refname | head -1)
          [ -n "$last" ] || { echo "::error title=No release tag::The upgrade proof needs the last release's tag."; exit 1; }
          floor=$(sed -n 's/^FLOOR=//p' deploy/database/proof.sh)
          if git merge-base --is-ancestor "$floor" "$last"; then from=$last; else
            from=$floor
            echo "$last is before $floor, the offline-upgrade floor (docs/deploy/database.md); proving from $floor"
          fi
          echo "upgrade from $from"
          make db-scripts-proof FROM="$from"
      - name: A fresh install
        run: make install-proof BUILD=1

  maintainer-review:
    # A raised or new baseline row, or a new access exception line, in this pull request's commits needs an approving
    # review on the pull request from a maintainer listed in .github/standards-maintainers.txt (scripts/baseline_history.py).
    # The review is read from GitHub, so no commit message can stand in for it. After the review is given, re-run this job.
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: The base revision's copies of the gate
        # The scripts, the make list and the ratchet tests below decide whether a rise passes, and this pull request
        # may have edited them to say it does. They are replaced here by the base's own files, so what judges the pull
        # request is what was already merged. An edit to any of them is itself a rise (scripts/baseline_history.py
        # PROTECTED), and this workflow file is the root of that trust: protect it with a code owner rule on .github/.
        # The pull request that adds the gate has no base copy: its own run, with a warning, and the owner's review by hand.
        env:
          TRUSTED: >-
            scripts/check_review_approval.py scripts/baseline_history.py scripts/check_access_exceptions.py
            scripts/check_portable_store.py scripts/check_config_literals.py scripts/check_typed_boundaries.py
            scripts/check_console_baselines.py
            scripts/keep_going.sh make/checks.mk Makefile
            packages/ops_store/tests/test_isolation_sites.py packages/ops_store/tests/test_relay_sites.py
            packages/ops_store/tests/test_loop_health.py deploy/database/tests/test_indexes.py
        run: |
          if ! git cat-file -e "$BASE_SHA:scripts/check_review_approval.py" 2>/dev/null; then
            echo "::warning title=Gate added here::The base has no maintainer-review gate, so this pull request's own copies run; its review is the owner's, by hand."
            exit 0
          fi
          for f in $TRUSTED; do
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then git show "$BASE_SHA:$f" > "$f"; fi
          done
          echo "gate files taken from $BASE_SHA"
      - name: A rise needs a maintainer's approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          review=$(uv run python scripts/check_review_approval.py --repo "$GITHUB_REPOSITORY" --pr "$PR" --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "maintainer review: $review"
          OPS_STANDARDS_BASE=$(git merge-base "$BASE_SHA" HEAD) OPS_STANDARDS_REVIEW="$review" make -s checks-history

  ci-ok:
    # The one required check: it always runs, waits for every other job, and fails when any of them failed or was
    # cancelled. A job the plan skipped counts as passed, so a narrow change is not held up by suites it did not touch.
    name: ci-ok
    if: always()
    needs: [plan, checks, service, package, console, docs, repo, store-mssql, release-proof, maintainer-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if grep -qE '"result": "(failure|cancelled)"' <<<"$NEEDS"; then echo "$NEEDS"; exit 1; fi
          echo "every check that ran passed"

  staging:
    # Every merge to develop, and every push to a release or hotfix branch, goes to staging once ci-ok passed for that
    # commit, so the owner tests the real combination. Pull requests and pushes to main never reach this job.
    # deploy-staging.yml holds the deploy, the freeze rules (a release or hotfix branch on origin, or STAGING_HOLD, skips
    # a develop deploy with a notice), the checks, the rollback and the summary.
    needs: ci-ok
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')) && needs.ci-ok.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-staging.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
