# CodeQL code scanning of the Python services and packages, the TypeScript console, SDK and CLI, and these workflows.
# No build step: CodeQL reads Python, JavaScript/TypeScript and Actions from source (build-mode none). Findings appear
# under Security > Code scanning and as annotations on the pull request.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries run against code that has not changed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - "**/node_modules"
              - "**/tests/fixtures"
              - plugins.bak-*
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
