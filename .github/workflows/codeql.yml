# CodeQL code scanning of the Python services and packages, the TypeScript console, SDK and CLI, and these workflows.
# No build step: CodeQL reads Python, JavaScript/TypeScript and Actions from source (build-mode none). Findings appear
# under Security > Code scanning and as annotations on the pull request.
name: codeql

on:
  pull_request:
    # A pull request into a release or hotfix branch runs ci.yml, whose `ready` waits for these checks.
    branches: [develop, main, "release/[0-9]*", "hotfix/**"]
  push:
    # A release or hotfix branch is scanned on every push, with the rest of its security scans (release-security.yml).
    branches: [main, "release/[0-9]*", "hotfix/**"]
  schedule:
    # Weekly, so new CodeQL queries run against code that has not changed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivial:
    # A pull request that changes no file (scripts/ci_trivial.py) has nothing to scan: the merge-back of a release that
    # develop already holds.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      trivial: ${{ steps.diff.outputs.trivial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          trivial=false
          if [ "$EVENT" = pull_request ]; then trivial=$(python3 scripts/ci_trivial.py "$BASE" HEAD); fi
          echo "trivial=$trivial" >> "$GITHUB_OUTPUT"

  analyze:
    needs: trivial
    # Fails closed: the scan is skipped only when the trivial job succeeded and said true; a failed or cancelled
    # trivial job, or any other answer, runs it.
    if: ${{ always() && !(needs.trivial.result == 'success' && needs.trivial.outputs.trivial == 'true') }}
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - "**/node_modules"
              - "**/tests/fixtures"
              - plugins.bak-*
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
