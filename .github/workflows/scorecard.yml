# OpenSSF Scorecard: scores the repository's security practices (pinned dependencies, token permissions, branch
# protection, signed releases and more) and uploads each finding to code scanning. On main the result is also
# published to api.scorecard.dev, which serves the README badge. A pull request that changes this file runs it
# unpublished, so a change to a workflow, a Dockerfile or an install script is checked before it merges.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  branch_protection_rule:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/Dockerfile"
      - "**/*.Dockerfile"
      - "sdk/check.sh"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write
      # Signs the published result so api.scorecard.dev can tell it came from this workflow on main.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
