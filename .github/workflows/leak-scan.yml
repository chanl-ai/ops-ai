# Refuses a pull request that adds tracker or task ids, home paths or card trailers to the tree or its messages.
name: leak-scan

on:
  # edited: a fixed title or body is scanned again; a rerun replays the old event's body.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  trivial:
    # A pull request whose diff is empty or only a release's version fields and changelog (scripts/ci_trivial.py) has
    # nothing to scan: the merge-back of a release into develop.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      trivial: ${{ steps.diff.outputs.trivial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          trivial=false
          if [ "$EVENT" = pull_request ]; then trivial=$(python3 scripts/ci_trivial.py "$BASE" HEAD); fi
          echo "trivial=$trivial" >> "$GITHUB_OUTPUT"

  scan:
    needs: trivial
    if: needs.trivial.outputs.trivial != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/leak_scan.py --base "$BASE"
