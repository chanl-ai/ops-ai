# Builds every Ops AI image for linux/amd64 and linux/arm64 and pushes it to ghcr.io/chanl-ai/ops-ai/<image>, tagged
# with the version and latest. Runs on a version tag (v0.1.0 publishes 0.1.0) or by hand with a version; the date tags
# every merge gets (release-tag.yml) do not start it.
# The build is deploy/release/images.sh, the same script the release package and install.sh --build use.
name: release-images

on:
  push:
    # Version tags only (v0.1.0): the date tag every merge gets (release-tag.yml, v2026-10-23.1) builds no images.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to publish (default: deploy/release/version)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=${INPUT_VERSION:-$(tr -d ' \n' < deploy/release/version)}; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh deploy/release/images.sh "$GITHUB_SHA" "$VERSION" --platforms linux/amd64,linux/arm64 --push --latest
      - name: Images published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for t in platform agents tools models kb files documents opa proxy console db-scripts; do
            docker buildx imagetools inspect "ghcr.io/chanl-ai/ops-ai/$t:$VERSION" --format '{{json .Manifest.Manifests}}' \
              | grep -o '"architecture":"[a-z0-9]*"' | sort -u | tr '\n' ' '
            echo " ghcr.io/chanl-ai/ops-ai/$t:$VERSION"
          done
