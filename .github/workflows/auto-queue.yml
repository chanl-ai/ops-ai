# The kanban's move from Reviewed to the merge queue, done by this workflow and not by a person
# (docs/architecture/delivery.md, "From draft to main"). A pull request into develop is armed for the queue (auto-merge,
# which the queue takes) when it is not a draft, carries the label `reviewed` (the reviewer's; one account authors every
# pull request here, so approvals cannot be used), does not carry `hold`, and comes from this repository. A push after
# the review takes `reviewed` off and disarms, unless it only merged develop in without touching what was reviewed. A
# stacked pull request (its base is not develop) is never armed; when its base merges and GitHub retargets it to
# develop, the `edited` event applies the same rule. Decisions: scripts/pr_flow.py auto-queue; its --self-test is in
# make checks. The merge-back that release-finish.yml opens is armed there.
#
# pull_request_target runs this file from develop with write access, so it checks out develop only (never the pull
# request's head) and calls the API with the event's pull request number. Permissions: pull-requests write for labels
# and comments; contents write because enabling auto-merge goes through the GraphQL mutation that asks for it
# (unverified: the minimum that works has not been measured on this repository).
name: auto-queue

on:
  pull_request_target:
    types: [labeled, unlabeled, ready_for_review, converted_to_draft, synchronize, edited]
    branches: [develop]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-judge
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: auto-queue-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/pr_flow.py auto-queue --pr "$PR" --action "$ACTION" --before "$BEFORE"
