# The full `make verify` in one job: nightly on main, on release tags and by hand. Pull requests run the same checks
# spread over parallel jobs (ci.yml).
name: verify-full

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPS_INFRA: external
  OPS_DATABASE_URL: postgresql+asyncpg://ops:ops@localhost:5477/ops_runtime
  OPS_TEST_DATABASE_URL: postgresql+asyncpg://ops:ops@localhost:5477/ops_test
  OPS_OPA_URL: http://127.0.0.1:8181
  OPS_SMTP_HOST: 127.0.0.1
  OPS_GREENMAIL_HOST: 127.0.0.1
  OPS_MAILPIT_HOST: 127.0.0.1

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: ops, POSTGRES_PASSWORD: ops, POSTGRES_DB: ops_runtime }
        ports: ["5477:5432"]
        options: --health-cmd "pg_isready -U ops -d ops_runtime" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The trailer checks read the history of the baseline files.
          fetch-depth: 0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .data/runner
          key: runner-wasm-${{ hashFiles('packages/ops_service_kit/src/ops_service_kit/settings.py') }}
      - uses: ./.github/actions/setup
        with:
          node: "true"
          browser: "true"
          infra: "true"
      - run: make verify
