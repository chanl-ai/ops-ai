# US2: uc-010 api: an edit off the module endpoint or with a literal credential header is refused (400) and nothing is staged.
# The runner gives each run its own database and ports.
id: us2-edit-refused
accept: US2
failure_mode: an edited call goes to another origin or stores a literal credential
layers:
  cli:
    run: "make usecase-test UC=uc-010 LAYER=api"
    expect: { exit: 0, stdout: "uc-010 api  19 checks passed" }
