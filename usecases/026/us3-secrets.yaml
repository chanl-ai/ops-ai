# US3: uc-013: the secret is sent, never returned, scrubbed from an echo, and rotated for the next call.
# Own database and ports: ops_usecase is shared.
id: us3-secrets
accept: US3
failure_mode: a secret value reaches a response or the call log, or a rotation is missed
layers:
  cli:
    run: "make usecase-test UC=uc-013 LAYER=api OPS_USECASE_DB=ops_usecase_c026 OPS_USECASE_AGENTS_PORT=8970 OPS_USECASE_TOOLS_PORT=8971 OPS_USECASE_MODELS_PORT=8972 OPS_USECASE_CONSOLE_PORT=3170"
    expect: { exit: 0, stdout: "uc-013 api  7 checks passed" }
