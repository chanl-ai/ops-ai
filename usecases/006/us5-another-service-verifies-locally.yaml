# US5: ops_identity. A service holding only the public key resolves tenant, team and roles; a team outside the token is
# 403 team_forbidden (I1); a read key is refused on every write method (I9). The seam test runs it against the real
# platform-service (tests/test_identity_seam.py, inside its suite).
id: us5-another-service-verifies-locally
accept: US5
failure_mode: a header widens the team, a read key writes, or a service trusts a token it cannot verify
layers:
  cli:
    run: "(cd packages/ops_identity && uv run pytest -q) && OPS_TEST_DATABASE_URL=postgresql+asyncpg://ops:ops@localhost:5477/ops_test_c006 make -C services/platform-service test && echo 'us5: ops_identity and the platform seam passed'"
    expect: { exit: 0, stdout: "us5: ops_identity and the platform seam passed" }
