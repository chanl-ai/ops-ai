# US2: uc-023. Invites, a role change, the last admin skipped with a reason (I6), and a removal that ends the member's
# sessions and disables the keys they created (I10).
id: us2-members-roles-and-removal
accept: US2
failure_mode: the last admin is demoted, or a removed member's session or key keeps working
layers:
  cli:
    run: "make usecase-test UC=uc-023 LAYER=api OPS_USECASE_DB=ops_usecase_c006 OPS_USECASE_AGENTS_PORT=8900 OPS_USECASE_TOOLS_PORT=8901 OPS_USECASE_MODELS_PORT=8902 OPS_USECASE_PLATFORM_PORT=8903 OPS_USECASE_PLATFORM_INTERNAL_PORT=8904 OPS_USECASE_CONSOLE_PORT=3218"
    expect: { exit: 0, stdout: "uc-023 api  6 checks passed" }
