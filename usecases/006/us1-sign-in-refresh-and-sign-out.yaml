# US1: uc-021. A member signs in, the token resolves while the session lives and expires on time, refresh rotates, a
# reused rotated refresh token ends the session, and sign-out ends both. Own database and ports: ops_usecase is shared.
id: us1-sign-in-refresh-and-sign-out
accept: US1
failure_mode: a reused refresh token is accepted, or a signed-out session still resolves
layers:
  cli:
    run: "make usecase-test UC=uc-021 LAYER=api OPS_USECASE_DB=ops_usecase_c006 OPS_USECASE_AGENTS_PORT=8900 OPS_USECASE_TOOLS_PORT=8901 OPS_USECASE_MODELS_PORT=8902 OPS_USECASE_PLATFORM_PORT=8903 OPS_USECASE_PLATFORM_INTERNAL_PORT=8904 OPS_USECASE_CONSOLE_PORT=3218"
    expect: { exit: 0, stdout: "uc-021 api  8 checks passed" }
